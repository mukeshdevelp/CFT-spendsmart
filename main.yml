AWSTemplateFormatVersion: '2010-09-09'
Description: SpendSmart root stack orchestrating nested infrastructure templates

Parameters:
  # name prefix for project use
  NamePrefix:
    Type: String
    Default: spendsmart-dev
  # existing key pair name to fetch
  ExistingEc2KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: mukesh
    Description: Existing EC2 key pair in the deployment region.
  # bastion ssh cidrs
  BastionSshCidrs:
    Type: CommaDelimitedList
    Default: '0.0.0.0/0,162.120.184.0/32'
    Description: CIDR allowlist for SSH to the bastion.
  # s3 athena bucket name
  S3BucketName:
    Type: String
    Default: athena-results-spendsmart-dev
    Description: Must be globally unique.
  # is bastion enabled in the code
  BastionEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'

  Ec2KeyPairMode:
    Type: String
    AllowedValues: [Existing, CreateNew]
    Default: Existing

  NewEc2KeyPairName:
    Type: String
    Default: spendsmart-dev-generated

  EksClusterMode:
    Type: String
    AllowedValues: [CreateNew, UseExisting]
    Default: CreateNew

  ExistingEksClusterName:
    Type: String
    Default: ''

  ExistingEksVpcId:
    Type: String
    Default: ''

  ExistingEksPrivateSubnetId:
    Type: String
    Default: ''

  ExistingEksClusterSecurityGroupId:
    Type: String
    Default: ''

  ExistingEksLoadBalancerControllerReady:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'

  SpendSmartWorkloadMode:
    Type: String
    AllowedValues: [InstallNew, LeaveExisting]
    Default: LeaveExisting

Rules:
  ExistingEksInputsRequired:
    RuleCondition: !Equals [!Ref EksClusterMode, UseExisting]
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingEksClusterName, '']]
        AssertDescription: ExistingEksClusterName is required in UseExisting mode.
      - Assert: !Not [!Equals [!Ref ExistingEksVpcId, '']]
        AssertDescription: ExistingEksVpcId is required in UseExisting mode.
      - Assert: !Not [!Equals [!Ref ExistingEksPrivateSubnetId, '']]
        AssertDescription: ExistingEksPrivateSubnetId is required in UseExisting mode.
      - Assert: !Not [!Equals [!Ref ExistingEksClusterSecurityGroupId, '']]
        AssertDescription: ExistingEksClusterSecurityGroupId is required in UseExisting mode.
  ExistingEksControllerRequired:
    RuleCondition: !And
      - !Equals [!Ref EksClusterMode, UseExisting]
      - !Equals [!Ref SpendSmartWorkloadMode, InstallNew]
    Assertions:
      - Assert: !Equals [!Ref ExistingEksLoadBalancerControllerReady, 'true']
        AssertDescription: Install AWS Load Balancer Controller before installing SpendSmart into an existing cluster.

Conditions:
  CreateNewEc2KeyPair: !Equals [!Ref Ec2KeyPairMode, CreateNew]
  CreateNewEksCluster: !Equals [!Ref EksClusterMode, CreateNew]
  UseExistingEksCluster: !Equals [!Ref EksClusterMode, UseExisting]
  InstallSpendSmart: !Equals [!Ref SpendSmartWorkloadMode, InstallNew]
  CreateBastion: !And
    - !Condition CreateNewEksCluster
    - !Equals [!Ref BastionEnabled, 'true']

Resources:
  GeneratedEc2KeyPair:
    Type: AWS::EC2::KeyPair
    Condition: CreateNewEc2KeyPair
    Properties:
      KeyName: !Ref NewEc2KeyPairName
      KeyFormat: pem
      KeyType: rsa

  Network:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewEksCluster
    Properties:
      TemplateURL: ./modules/network-skeleton/template.yaml
      Parameters:
        ProjectName: spendsmart
        NamePrefix: !Ref NamePrefix
        Environment: dev
        EksClusterName: spendsmart

  Bastion:
    Type: AWS::CloudFormation::Stack
    Condition: CreateBastion
    DependsOn:
      - Network
    Properties:
      TemplateURL: ./modules/bastion/template.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        BastionEnabled: !Ref BastionEnabled
        Ec2KeyName: !If [CreateNewEc2KeyPair, !Ref GeneratedEc2KeyPair, !Ref ExistingEc2KeyName]
        BastionSshCidrs: !Join [',', !Ref BastionSshCidrs]
        EksClusterName: spendsmart
        EksRegion: !Ref AWS::Region
        VpcId: !GetAtt Network.Outputs.VpcId
        PublicSubnetId: !GetAtt Network.Outputs.PublicSubnet1Id

  Eks:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewEksCluster
    DependsOn:
      - Network
    Properties:
      TemplateURL: ./modules/eks/template.yaml
      Parameters:
        ProjectName: spendsmart
        NamePrefix: !Ref NamePrefix
        Environment: dev
        EksClusterName: spendsmart
        VpcId: !GetAtt Network.Outputs.VpcId
        PrivateSubnet1Id: !GetAtt Network.Outputs.PrivateSubnet1Id
        PrivateSubnet2Id: !GetAtt Network.Outputs.PrivateSubnet2Id
        BastionSecurityGroupId: !If
          - CreateBastion
          - !GetAtt Bastion.Outputs.BastionSecurityGroupId
          - ''

  Db:
    Type: AWS::CloudFormation::Stack
    Condition: CreateBastion
    DependsOn:
      - Eks
      - Bastion
      - BastionEksAccessEntry
    Properties:
      TemplateURL: ./modules/db/template.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        ClusterName: spendsmart
        BastionInstanceId: !GetAtt Bastion.Outputs.BastionInstanceId
        BastionRoleName: !GetAtt Bastion.Outputs.BastionRoleName

  Alb:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewEksCluster
    DependsOn:
      - Network
      - Eks
    Properties:
      TemplateURL: ./modules/alb/template.yaml
      Parameters:
        ProjectName: spendsmart
        NamePrefix: !Ref NamePrefix
        Environment: dev
        VpcId: !GetAtt Network.Outputs.VpcId
        PublicSubnet1Id: !GetAtt Network.Outputs.PublicSubnet1Id
        PublicSubnet2Id: !GetAtt Network.Outputs.PublicSubnet2Id
        PrivateSubnet1Id: !GetAtt Network.Outputs.PrivateSubnet1Id
        PrivateSubnet2Id: !GetAtt Network.Outputs.PrivateSubnet2Id
        EksClusterName: spendsmart
        NodesSecurityGroupId: !GetAtt Eks.Outputs.EksNodesSecurityGroupId
        AlbName: spendsmart-dev-alb
        AlbTargetGroupName: spendsmart-dev-tg
        AlbListenerPort: 80
        AlbTargetPort: 30080
        AlbHealthCheckPath: /healthz
        NodeGroup1Name: !GetAtt Eks.Outputs.EksNodeGroup1Name
        NodeGroup2Name: !GetAtt Eks.Outputs.EksNodeGroup2Name

  BastionEksAccessEntry:
    Type: AWS::EKS::AccessEntry
    Condition: CreateBastion
    DependsOn:
      - Eks
      - Bastion
    Properties:
      ClusterName: !GetAtt Eks.Outputs.EksClusterName
      PrincipalArn: !GetAtt Bastion.Outputs.BastionRoleArn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

  SpendSmart:
    Type: AWS::CloudFormation::Stack
    Condition: InstallSpendSmart
    Properties:
      TemplateURL: ./modules/spendsmart/template.yaml
      Parameters:
        ClusterName: !If [UseExistingEksCluster, !Ref ExistingEksClusterName, !GetAtt Eks.Outputs.EksClusterName]
        ClusterSecurityGroupId: !If [UseExistingEksCluster, !Ref ExistingEksClusterSecurityGroupId, !GetAtt Eks.Outputs.EksClusterSecurityGroupId]
        VpcId: !If [UseExistingEksCluster, !Ref ExistingEksVpcId, !GetAtt Network.Outputs.VpcId]
        PrivateSubnetId: !If [UseExistingEksCluster, !Ref ExistingEksPrivateSubnetId, !GetAtt Network.Outputs.PrivateSubnet1Id]
        InstallAlbController: !If [CreateNewEksCluster, 'true', 'false']
        ChartRepository: https://github.com/OT-CONTAINER-KIT/helm-charts.git
        ChartBranch: feature/spendsmart-helm-chart
        Namespace: spendsmart

  S3:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./modules/s3/template.yaml
      Parameters:
        ProjectName: spendsmart
        Environment: dev
        S3BucketName: !Ref S3BucketName

  Glue:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./modules/glue/template.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        BucketArn: !GetAtt S3.Outputs.BucketArn

  Athena:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./modules/athena/template.yaml
      Parameters:
        BucketName: !GetAtt S3.Outputs.BucketName

  Iam:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./modules/iam/template.yaml
      Parameters:
        ProjectName: spendsmart
        NamePrefix: !Ref NamePrefix
        Environment: dev
        BucketArn: !GetAtt S3.Outputs.BucketArn
        CurPrefix: cur
        AthenaResultsPrefix: athena-results

Outputs:
  Ec2KeyPairName:
    Value: !If [CreateNewEc2KeyPair, !Ref GeneratedEc2KeyPair, !Ref ExistingEc2KeyName]
  VpcId:
    Value: !If [UseExistingEksCluster, !Ref ExistingEksVpcId, !GetAtt Network.Outputs.VpcId]
  VpcCidr:
    Condition: CreateNewEksCluster
    Value: !GetAtt Network.Outputs.VpcCidr
  PublicSubnet1Id:
    Condition: CreateNewEksCluster
    Value: !GetAtt Network.Outputs.PublicSubnet1Id
  PublicSubnet2Id:
    Condition: CreateNewEksCluster
    Value: !GetAtt Network.Outputs.PublicSubnet2Id
  PrivateSubnet1Id:
    Value: !If [UseExistingEksCluster, !Ref ExistingEksPrivateSubnetId, !GetAtt Network.Outputs.PrivateSubnet1Id]
  PrivateSubnet2Id:
    Condition: CreateNewEksCluster
    Value: !GetAtt Network.Outputs.PrivateSubnet2Id
  BastionInstanceId:
    Condition: CreateBastion
    Value: !GetAtt Bastion.Outputs.BastionInstanceId
  BastionSecurityGroupId:
    Condition: CreateBastion
    Value: !GetAtt Bastion.Outputs.BastionSecurityGroupId
  BastionPublicIp:
    Condition: CreateBastion
    Value: !GetAtt Bastion.Outputs.BastionPublicIp
  EksClusterName:
    Value: !If [UseExistingEksCluster, !Ref ExistingEksClusterName, !GetAtt Eks.Outputs.EksClusterName]
  EksClusterEndpoint:
    Condition: CreateNewEksCluster
    Value: !GetAtt Eks.Outputs.EksClusterEndpoint
  EksClusterArn:
    Value: !If
      - UseExistingEksCluster
      - !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ExistingEksClusterName}'
      - !GetAtt Eks.Outputs.EksClusterArn
  EksClusterSecurityGroupId:
    Value: !If [UseExistingEksCluster, !Ref ExistingEksClusterSecurityGroupId, !GetAtt Eks.Outputs.EksClusterSecurityGroupId]
  EksNodesSecurityGroupId:
    Condition: CreateNewEksCluster
    Value: !GetAtt Eks.Outputs.EksNodesSecurityGroupId
  EksNodeGroupNames:
    Condition: CreateNewEksCluster
    Value: !GetAtt Eks.Outputs.EksNodeGroupNames
  EksConfigureKubectl:
    Value: !If
      - UseExistingEksCluster
      - !Sub 'aws eks update-kubeconfig --region ${AWS::Region} --name ${ExistingEksClusterName}'
      - !GetAtt Eks.Outputs.EksConfigureKubectl
  AlbControllerRoleArn:
    Condition: CreateNewEksCluster
    Value: !GetAtt Eks.Outputs.AlbControllerRoleArn
  SpendSmartDeploymentHostId:
    Condition: InstallSpendSmart
    Value: !GetAtt SpendSmart.Outputs.DeploymentHostId
  SpendSmartNamespace:
    Condition: InstallSpendSmart
    Value: !GetAtt SpendSmart.Outputs.Namespace
  SpendSmartIngressName:
    Condition: InstallSpendSmart
    Value: !GetAtt SpendSmart.Outputs.IngressName
  
  
  ClickHouseEndpoint:
    Condition: CreateBastion
    Value: !GetAtt Db.Outputs.ClickHouseEndpoint
  ClickHouseHttpPort:
    Condition: CreateBastion
    Value: !GetAtt Db.Outputs.ClickHouseHttpPort
  ClickHouseNativePort:
    Condition: CreateBastion
    Value: !GetAtt Db.Outputs.ClickHouseNativePort
  ClickHouseDatabase:
    Condition: CreateBastion
    Value: !GetAtt Db.Outputs.ClickHouseDatabase
  ClickHouseSecretArn:
    Condition: CreateBastion
    Value: !GetAtt Db.Outputs.ClickHouseSecretArn
  BucketName:
    Value: !GetAtt S3.Outputs.BucketName
  BucketArn:
    Value: !GetAtt S3.Outputs.BucketArn
  DataLocation:
    Value: !GetAtt S3.Outputs.DataLocation
  AthenaOutputLocation:
    Value: !GetAtt S3.Outputs.AthenaOutputLocation
  CurReportName:
    Value: !GetAtt S3.Outputs.CurReportName
  CurLocation:
    Value: !GetAtt S3.Outputs.CurLocation
  CurAthenaDatabaseName:
    Value: !GetAtt S3.Outputs.CurAthenaDatabaseName
  CurAthenaTableName:
    Value: !GetAtt S3.Outputs.CurAthenaTableName
  GlueDatabaseName:
    Value: !GetAtt Glue.Outputs.GlueDatabaseName
  GlueRoleArn:
    Value: !GetAtt Glue.Outputs.GlueRoleArn
  AthenaWorkgroupName:
    Value: !GetAtt Athena.Outputs.AthenaWorkgroupName
  AnalyticsIamRoleName:
    Value: !GetAtt Iam.Outputs.AnalyticsIamRoleName
  AnalyticsIamRoleArn:
    Value: !GetAtt Iam.Outputs.AnalyticsIamRoleArn
  AnalyticsIamPolicyName:
    Value: !GetAtt Iam.Outputs.AnalyticsIamPolicyName
  AnalyticsIamPolicyArn:
    Value: !GetAtt Iam.Outputs.AnalyticsIamPolicyArn
  PublicSubnetIds:
    Condition: CreateNewEksCluster
    Value: !GetAtt Network.Outputs.PublicSubnetIds
  PrivateSubnetIds:
    Condition: CreateNewEksCluster
    Value: !GetAtt Network.Outputs.PrivateSubnetIds
  NatGatewayIds:
    Condition: CreateNewEksCluster
    Value: !GetAtt Network.Outputs.NatGatewayIds
  InternetGatewayId:
    Condition: CreateNewEksCluster
    Value: !GetAtt Network.Outputs.InternetGatewayId
