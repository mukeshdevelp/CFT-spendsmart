AWSTemplateFormatVersion: '2010-09-09'
Description: Bastion host, EKS access entry, and optional background cluster bootstrap.

Parameters:
  NamePrefix:
    Type: String
    Default: spendsmart-dev
  BastionEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  BastionAssociateEip:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  BastionInstanceType:
    Type: String
    Default: t3.micro
  BastionAmiSsmParameter:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  BastionRootVolumeSize:
    Type: Number
    Default: 8
  BastionRootVolumeType:
    Type: String
    Default: gp3
  BastionRootDeviceName:
    Type: String
    Default: /dev/xvda
  Ec2KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  BastionSshCidr1:
    Type: String
    Description: Primary SSH allowlist CIDR for the bastion.
  BastionSshCidr2:
    Type: String
    Default: ''
    Description: Optional second SSH CIDR (empty = not used).
  TcpProtocol:
    Type: String
    Default: tcp
  AllTrafficProtocol:
    Type: String
    Default: '-1'
  BastionNameSuffix:
    Type: String
    Default: -bastion
  BastionEipNameSuffix:
    Type: String
    Default: -bastion-eip
  BastionSshPort:
    Type: Number
    Default: 22
  BastionEgressCidr:
    Type: String
    Default: 0.0.0.0/0
  BastionSecurityGroupDescription:
    Type: String
    Default: Bastion host in a public subnet
  BastionEgressDescription:
    Type: String
    Default: Bastion egress
  BastionMetadataEndpoint:
    Type: String
    AllowedValues: [enabled, disabled]
    Default: enabled
  BastionMetadataTokens:
    Type: String
    AllowedValues: [required, optional]
    Default: required
  BastionMetadataHopLimit:
    Type: Number
    Default: 2
  BastionRootVolumeEncrypted:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  BastionRootVolumeDeleteOnTermination:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  EksNodesSshIngressDescription:
    Type: String
    Default: SSH from bastion
  VpcId:
    Type: String
  PublicSubnetId:
    Type: String
  EksClusterName:
    Type: String
  EksRegion:
    Type: String
  EksClusterSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  EksNodesSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  BastionRoleName:
    Type: String
    Description: IAM role name from modules/iam (bastion instance profile).
  BastionRoleArn:
    Type: String
    Description: IAM role ARN for EKS access entry.
  BastionKubectlVersion:
    Type: String
    Default: '1.36.2'
  PostgresSecretName:
    Type: String
  ClickHouseSecretName:
    Type: String
  BootstrapAssetsS3Uri:
    Type: String
    Description: s3://bucket/bastion-assets prefix synced at package time.
  RunClusterBootstrap:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'

Conditions:
  CreateBastionEip: !And
    - !Condition CreateBastion
    - !Equals [!Ref BastionAssociateEip, 'true']
  CreateBastion: !Equals [!Ref BastionEnabled, 'true']
  BastionRootDeleteOnTermination: !Equals [!Ref BastionRootVolumeDeleteOnTermination, 'true']
  BastionRootEncrypted: !Equals [!Ref BastionRootVolumeEncrypted, 'true']
  RunClusterBootstrap: !And
    - !Condition CreateBastion
    - !Equals [!Ref RunClusterBootstrap, 'true']
  HasBastionSshCidr2: !Not [!Equals [!Ref BastionSshCidr2, '']]

Resources:
  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: CreateBastion
    Properties:
      InstanceProfileName: !Sub '${NamePrefix}-bastion-profile'
      Roles:
        - !Ref BastionRoleName

  BastionEksAccessEntry:
    Type: AWS::EKS::AccessEntry
    Condition: CreateBastion
    Properties:
      ClusterName: !Ref EksClusterName
      PrincipalArn: !Ref BastionRoleArn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateBastion
    Properties:
      GroupDescription: !Ref BastionSecurityGroupDescription
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: !Ref TcpProtocol
          FromPort: !Ref BastionSshPort
          ToPort: !Ref BastionSshPort
          CidrIp: !Ref BastionSshCidr1
          Description: SSH to bastion (CIDR 1)
      SecurityGroupEgress:
        - IpProtocol: !Ref AllTrafficProtocol
          CidrIp: !Ref BastionEgressCidr
          Description: !Ref BastionEgressDescription
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}${BastionNameSuffix}'
        - Key: Project
          Value: spendsmart
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: CFT

  BastionSshIngressCidr2:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasBastionSshCidr2
    Properties:
      GroupId: !Ref BastionSecurityGroup
      IpProtocol: !Ref TcpProtocol
      FromPort: !Ref BastionSshPort
      ToPort: !Ref BastionSshPort
      CidrIp: !Ref BastionSshCidr2
      Description: SSH to bastion (CIDR 2)

  BastionHttpsToEksApiIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CreateBastion
    Properties:
      GroupId: !Ref EksClusterSecurityGroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref BastionSecurityGroup
      Description: HTTPS from bastion to EKS private API

  BastionSshToEksNodesIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CreateBastion
    Properties:
      GroupId: !Ref EksNodesSecurityGroupId
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId: !Ref BastionSecurityGroup
      Description: SSH from bastion to EKS worker nodes

  BastionHttpsToEksNodesIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CreateBastion
    Properties:
      GroupId: !Ref EksNodesSecurityGroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref BastionSecurityGroup
      Description: HTTPS from bastion to worker nodes

  BastionInstance:
    Type: AWS::EC2::Instance
    Condition: CreateBastion
    DependsOn:
      - BastionEksAccessEntry
      - BastionHttpsToEksApiIngress
      - BastionHttpsToEksNodesIngress
      - BastionSshToEksNodesIngress
    Properties:
      ImageId: !Ref BastionAmiSsmParameter
      InstanceType: !Ref BastionInstanceType
      IamInstanceProfile: !Ref BastionInstanceProfile
      UserData:
        Fn::Base64: !Sub
          - |
            #!/bin/bash
            set -euo pipefail
            dnf install -y aws-cfn-bootstrap python3
            command -v curl >/dev/null || dnf install -y curl-minimal
            mkdir -p /opt/spendsmart/manifests
            aws s3 sync "${BootstrapAssetsS3Uri}/" /opt/spendsmart/ --region ${AWS::Region}
            chmod +x /opt/spendsmart/cluster-bootstrap.sh /opt/spendsmart/install-kubectl.sh /opt/spendsmart/configure-kubeconfig.sh
            export KUBECTL_VERSION=${BastionKubectlVersion}
            /opt/spendsmart/install-kubectl.sh
            export EKS_REGION=${EksRegion}
            export EKS_CLUSTER_NAME=${EksClusterName}
            /opt/spendsmart/configure-kubeconfig.sh
            if [ "${RunBootstrapFlag}" = "true" ]; then
              cat >/etc/systemd/system/spendsmart-cluster-bootstrap.service <<UNIT
            [Unit]
            Description=SpendSmart EKS cluster bootstrap (kubectl + databases)
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=oneshot
            Environment=EKS_REGION=${EksRegion}
            Environment=EKS_CLUSTER_NAME=${EksClusterName}
            Environment=POSTGRES_SECRET_NAME=${PostgresSecretName}
            Environment=CLICKHOUSE_SECRET_NAME=${ClickHouseSecretName}
            Environment=KUBECTL_VERSION=${BastionKubectlVersion}
            Environment=MANIFESTS_DIR=/opt/spendsmart/manifests
            ExecStart=/opt/spendsmart/cluster-bootstrap.sh
            RemainAfterExit=yes

            [Install]
            WantedBy=multi-user.target
            UNIT
              systemctl daemon-reload
              systemctl enable --now spendsmart-cluster-bootstrap.service
            fi
          - BootstrapAssetsS3Uri: !Ref BootstrapAssetsS3Uri
            RunBootstrapFlag: !If [RunClusterBootstrap, 'true', 'false']
            EksRegion: !Ref EksRegion
            EksClusterName: !Ref EksClusterName
            PostgresSecretName: !Ref PostgresSecretName
            ClickHouseSecretName: !Ref ClickHouseSecretName
            BastionKubectlVersion: !Ref BastionKubectlVersion
      KeyName: !Ref Ec2KeyName
      SubnetId: !Ref PublicSubnetId
      SecurityGroupIds:
        - !Ref BastionSecurityGroup
      MetadataOptions:
        HttpEndpoint: !Ref BastionMetadataEndpoint
        HttpTokens: !Ref BastionMetadataTokens
        HttpPutResponseHopLimit: !Ref BastionMetadataHopLimit
      BlockDeviceMappings:
        - DeviceName: !Ref BastionRootDeviceName
          Ebs:
            VolumeSize: !Ref BastionRootVolumeSize
            VolumeType: !Ref BastionRootVolumeType
            Encrypted: !If [BastionRootEncrypted, true, false]
            DeleteOnTermination: !If [BastionRootDeleteOnTermination, true, false]
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}${BastionNameSuffix}'
        - Key: Role
          Value: cluster-admin
        - Key: Project
          Value: spendsmart
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: CFT

  BastionEip:
    Type: AWS::EC2::EIP
    Condition: CreateBastionEip
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}${BastionEipNameSuffix}'
        - Key: Project
          Value: spendsmart
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: CFT

  BastionEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Condition: CreateBastionEip
    Properties:
      InstanceId: !Ref BastionInstance
      EIP: !Ref BastionEip

Outputs:
  BastionInstanceId:
    Condition: CreateBastion
    Value: !Ref BastionInstance
  BastionSecurityGroupId:
    Condition: CreateBastion
    Value: !Ref BastionSecurityGroup
  SshKeyPairName:
    Value: !Ref Ec2KeyName
  BastionPublicIp:
    Condition: CreateBastion
    Value: !If [CreateBastionEip, !Ref BastionEip, !GetAtt BastionInstance.PublicIp]
  BastionRoleArn:
    Condition: CreateBastion
    Value: !Ref BastionRoleArn
  BastionRoleName:
    Condition: CreateBastion
    Value: !Ref BastionRoleName
