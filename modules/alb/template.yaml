AWSTemplateFormatVersion: '2010-09-09'
Description: SpendSmart ALB — listeners 8080 (frontend), 8081 (backend), 8083 (keycloak)

Parameters:
  ProjectName:
    Type: String
  NamePrefix:
    Type: String
  Environment:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnet1Id:
    Type: AWS::EC2::Subnet::Id
  PublicSubnet2Id:
    Type: AWS::EC2::Subnet::Id
  EksClusterName:
    Type: String
  NodeGroup1Name:
    Type: String
  NodeGroup2Name:
    Type: String
  NodesSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  AlbName:
    Type: String
  FrontendListenerPort:
    Type: Number
    Default: 8080
  FrontendTargetPort:
    Type: Number
    Default: 30080
  FrontendHealthCheckPath:
    Type: String
    Default: /
  BackendListenerPort:
    Type: Number
    Default: 8081
  BackendTargetPort:
    Type: Number
    Default: 30081
  BackendHealthCheckPath:
    Type: String
    Default: /api/v1/healthz
  KeycloakListenerPort:
    Type: Number
    Default: 8083
  KeycloakTargetPort:
    Type: Number
    Default: 30083
  KeycloakHealthCheckPath:
    Type: String
    Default: /

Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${NamePrefix} ALB security group'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref FrontendListenerPort
          ToPort: !Ref FrontendListenerPort
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: !Ref BackendListenerPort
          ToPort: !Ref BackendListenerPort
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: !Ref KeycloakListenerPort
          ToPort: !Ref KeycloakListenerPort
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref FrontendTargetPort
          ToPort: !Ref KeycloakTargetPort
          DestinationSecurityGroupId: !Ref NodesSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-alb-sg'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CFT

  AlbToNodesIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref NodesSecurityGroupId
      IpProtocol: tcp
      FromPort: !Ref FrontendTargetPort
      ToPort: !Ref KeycloakTargetPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: ALB to SpendSmart NodePorts

  SpendSmartAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Ref AlbName
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets:
        - !Ref PublicSubnet1Id
        - !Ref PublicSubnet2Id
      Tags:
        - Key: Name
          Value: !Ref AlbName
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${NamePrefix}-fe-tg'
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref FrontendTargetPort
      TargetType: instance
      HealthCheckPath: !Ref FrontendHealthCheckPath
      Matcher:
        HttpCode: '200-399'

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${NamePrefix}-be-tg'
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref BackendTargetPort
      TargetType: instance
      HealthCheckPath: !Ref BackendHealthCheckPath
      Matcher:
        HttpCode: '200-399'

  KeycloakTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${NamePrefix}-kc-tg'
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref KeycloakTargetPort
      TargetType: instance
      HealthCheckPath: !Ref KeycloakHealthCheckPath
      Matcher:
        HttpCode: '200-399'

  FrontendListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref SpendSmartAlb
      Port: !Ref FrontendListenerPort
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  BackendListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref SpendSmartAlb
      Port: !Ref BackendListenerPort
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  KeycloakListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref SpendSmartAlb
      Port: !Ref KeycloakListenerPort
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref KeycloakTargetGroup

  TargetRegistrationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: attach-nodegroup-asg-to-target-groups
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeNodegroup
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:AttachLoadBalancerTargetGroups
                  - autoscaling:DetachLoadBalancerTargetGroups
                Resource: '*'

  TargetRegistrationFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      Role: !GetAtt TargetRegistrationRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          eks = boto3.client('eks')
          asg = boto3.client('autoscaling')

          def asg_names(cluster, groups):
              names = []
              for g in groups:
                  ng = eks.describe_nodegroup(
                      clusterName=cluster, nodegroupName=g)['nodegroup']
                  names += [a['name'] for a in ng['resources']['autoScalingGroups']]
              return names

          def attach(cluster, groups, tgs):
              for name in asg_names(cluster, groups):
                  asg.attach_load_balancer_target_groups(
                      AutoScalingGroupName=name, TargetGroupARNs=tgs)

          def detach(cluster, groups, tgs):
              try:
                  for name in asg_names(cluster, groups):
                      asg.detach_load_balancer_target_groups(
                          AutoScalingGroupName=name, TargetGroupARNs=tgs)
              except Exception as e:
                  print('detach skipped:', e)

          def handler(event, context):
              try:
                  p = event['ResourceProperties']
                  req = event['RequestType']
                  tgs = p['TargetGroupArns']
                  if req == 'Create':
                      attach(p['ClusterName'], p['NodeGroupNames'], tgs)
                  elif req == 'Update':
                      old = event.get('OldResourceProperties', {})
                      old_tgs = old.get('TargetGroupArns', [])
                      if old_tgs:
                          detach(old['ClusterName'], old['NodeGroupNames'], old_tgs)
                      attach(p['ClusterName'], p['NodeGroupNames'], tgs)
                  elif req == 'Delete':
                      detach(p['ClusterName'], p['NodeGroupNames'], tgs)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  print('error:', e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  TargetRegistration:
    Type: Custom::TargetGroupRegistration
    DependsOn:
      - FrontendListener
      - BackendListener
      - KeycloakListener
    Properties:
      ServiceToken: !GetAtt TargetRegistrationFunction.Arn
      ClusterName: !Ref EksClusterName
      TargetGroupArns:
        - !Ref FrontendTargetGroup
        - !Ref BackendTargetGroup
        - !Ref KeycloakTargetGroup
      NodeGroupNames:
        - !Ref NodeGroup1Name
        - !Ref NodeGroup2Name

Outputs:
  AlbDnsName:
    Value: !GetAtt SpendSmartAlb.DNSName
  AlbArn:
    Value: !Ref SpendSmartAlb
  FrontendUrl:
    Value: !Sub
      - 'http://${Dns}:${Port}'
      - Dns: !GetAtt SpendSmartAlb.DNSName
        Port: !Ref FrontendListenerPort
  BackendUrl:
    Value: !Sub
      - 'http://${Dns}:${Port}'
      - Dns: !GetAtt SpendSmartAlb.DNSName
        Port: !Ref BackendListenerPort
  KeycloakUrl:
    Value: !Sub
      - 'http://${Dns}:${Port}'
      - Dns: !GetAtt SpendSmartAlb.DNSName
        Port: !Ref KeycloakListenerPort
  FrontendTargetPort:
    Value: !Ref FrontendTargetPort
  BackendTargetPort:
    Value: !Ref BackendTargetPort
  KeycloakTargetPort:
    Value: !Ref KeycloakTargetPort
