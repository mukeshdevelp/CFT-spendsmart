AWSTemplateFormatVersion: '2010-09-09'
Description: Database credentials for in-cluster PostgreSQL and ClickHouse on node group 2.

Parameters:
  NamePrefix:
    Type: String

Resources:
  PostgresSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${NamePrefix}/postgres'
      Description: SpendSmart PostgreSQL on node group 2
      GenerateSecretString:
        SecretStringTemplate: '{"username":"dbadmin","database":"cloudsentry"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\\''`$<>&;|'
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-postgres-secret'
        - Key: Project
          Value: spendsmart
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: CFT

  ClickHouseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${NamePrefix}/clickhouse'
      Description: SpendSmart ClickHouse on node group 2
      GenerateSecretString:
        SecretStringTemplate: '{"username":"default","database":"spendsmart"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\\''`$<>&;|'
      Tags:
        - Key: Name
          Value: !Sub '${NamePrefix}-clickhouse-secret'
        - Key: Project
          Value: spendsmart
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: CFT

Outputs:
  PostgresSecretArn:
    Value: !Ref PostgresSecret
  ClickHouseSecretArn:
    Value: !Ref ClickHouseSecret
  PostgresEndpoint:
    Value: postgres.databases.svc.cluster.local
  PostgresPort:
    Value: '5432'
  PostgresDatabase:
    Value: cloudsentry
  ClickHouseEndpoint:
    Value: clickhouse.databases.svc.cluster.local
  ClickHouseHttpPort:
    Value: '8123'
  ClickHouseNativePort:
    Value: '9000'
  ClickHouseDatabase:
    Value: spendsmart
