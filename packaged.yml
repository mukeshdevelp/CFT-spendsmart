AWSTemplateFormatVersion: '2010-09-09'
Description: SpendSmart root stack orchestrating nested infrastructure templates
Parameters:
  NamePrefix:
    Type: String
    Default: spendsmart-dev
  ExistingEc2KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: mukesh
    Description: Existing EC2 key pair in the deployment region.
  BastionSshCidrs:
    Type: CommaDelimitedList
    Default: 0.0.0.0/0,162.120.184.0/32
    Description: CIDR allowlist for SSH to the bastion.
  S3BucketName:
    Type: String
    Default: athena-results-spendsmart-dev
    Description: Data, Athena results, and CUR bucket (created by stack; deleted on
      rollback when empty).
  BastionEnabled:
    Type: String
    AllowedValues:
    - 'true'
    - 'false'
    Default: 'true'
  Ec2KeyPairMode:
    Type: String
    AllowedValues:
    - Existing
    - CreateNew
    Default: Existing
  NewEc2KeyPairName:
    Type: String
    Default: spendsmart-dev-generated
  EksClusterMode:
    Type: String
    AllowedValues:
    - CreateNew
    - UseExisting
    Default: CreateNew
  ExistingEksClusterName:
    Type: String
    Default: ''
  ExistingEksVpcId:
    Type: String
    Default: ''
  ExistingEksPrivateSubnetId:
    Type: String
    Default: ''
  ExistingEksClusterSecurityGroupId:
    Type: String
    Default: ''
  ExistingEksLoadBalancerControllerReady:
    Type: String
    AllowedValues:
    - 'true'
    - 'false'
    Default: 'false'
  CfnTemplateBucket:
    Type: String
    Default: spendsmart-cfn-packages
    Description: S3 bucket for packaged nested templates and bastion bootstrap assets
      (bastion-assets/).
  DeploySpendSmart:
    Type: String
    AllowedValues:
    - 'true'
    - 'false'
    Default: 'true'
    Description: Deploy SpendSmart (Helm frontend/backend + Keycloak) via modules/spendsmart.
  HarborUsername:
    Type: String
    NoEcho: true
    Default: ''
    Description: Harbor robot/user for private images (required when DeploySpendSmart=true).
  HarborPassword:
    Type: String
    NoEcho: true
    Default: ''
    Description: Harbor password for HarborUsername.
Rules:
  ExistingEksInputsRequired:
    RuleCondition:
      Fn::Equals:
      - Ref: EksClusterMode
      - UseExisting
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ExistingEksClusterName
          - ''
      AssertDescription: ExistingEksClusterName is required in UseExisting mode.
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ExistingEksVpcId
          - ''
      AssertDescription: ExistingEksVpcId is required in UseExisting mode.
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ExistingEksPrivateSubnetId
          - ''
      AssertDescription: ExistingEksPrivateSubnetId is required in UseExisting mode.
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ExistingEksClusterSecurityGroupId
          - ''
      AssertDescription: ExistingEksClusterSecurityGroupId is required in UseExisting
        mode.
Conditions:
  CreateNewEc2KeyPair:
    Fn::Equals:
    - Ref: Ec2KeyPairMode
    - CreateNew
  CreateNewEksCluster:
    Fn::Equals:
    - Ref: EksClusterMode
    - CreateNew
  UseExistingEksCluster:
    Fn::Equals:
    - Ref: EksClusterMode
    - UseExisting
  CreateBastion:
    Fn::And:
    - Condition: CreateNewEksCluster
    - Fn::Equals:
      - Ref: BastionEnabled
      - 'true'
  HasBastionSshCidr2:
    Fn::Not:
    - Fn::Equals:
      - Fn::Join:
        - ','
        - Ref: BastionSshCidrs
      - Fn::Select:
        - 0
        - Ref: BastionSshCidrs
  DeploySpendSmartApp:
    Fn::And:
    - Condition: CreateNewEksCluster
    - Fn::Equals:
      - Ref: DeploySpendSmart
      - 'true'
Resources:
  GeneratedEc2KeyPair:
    Type: AWS::EC2::KeyPair
    Condition: CreateNewEc2KeyPair
    Properties:
      KeyName:
        Ref: NewEc2KeyPairName
      KeyFormat: pem
      KeyType: rsa
  Network:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewEksCluster
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/c9943b6f23b1d4599a33b2424eec411d.template
      Parameters:
        ProjectName: spendsmart
        NamePrefix:
          Ref: NamePrefix
        Environment: dev
        EksClusterName: spendsmart
  Bastion:
    Type: AWS::CloudFormation::Stack
    Condition: CreateBastion
    DependsOn:
    - Network
    - Eks
    - Db
    - Iam
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/2c309fa211c1e4ec709d71b57231d884.template
      Parameters:
        NamePrefix:
          Ref: NamePrefix
        BastionEnabled:
          Ref: BastionEnabled
        Ec2KeyName:
          Fn::If:
          - CreateNewEc2KeyPair
          - Ref: GeneratedEc2KeyPair
          - Ref: ExistingEc2KeyName
        BastionSshCidr1:
          Fn::Select:
          - 0
          - Ref: BastionSshCidrs
        BastionSshCidr2:
          Fn::If:
          - HasBastionSshCidr2
          - Fn::Select:
            - 1
            - Ref: BastionSshCidrs
          - ''
        EksClusterName: spendsmart
        EksRegion:
          Ref: AWS::Region
        VpcId:
          Fn::GetAtt:
          - Network
          - Outputs.VpcId
        PublicSubnetId:
          Fn::GetAtt:
          - Network
          - Outputs.PublicSubnet1Id
        PostgresSecretName:
          Fn::Sub: ${NamePrefix}/postgres
        ClickHouseSecretName:
          Fn::Sub: ${NamePrefix}/clickhouse
        EksClusterSecurityGroupId:
          Fn::GetAtt:
          - Eks
          - Outputs.EksClusterSecurityGroupId
        EksNodesSecurityGroupId:
          Fn::GetAtt:
          - Eks
          - Outputs.EksNodesSecurityGroupId
        BastionRoleName:
          Fn::GetAtt:
          - Iam
          - Outputs.BastionRoleName
        BastionRoleArn:
          Fn::GetAtt:
          - Iam
          - Outputs.BastionRoleArn
        BootstrapAssetsS3Uri:
          Fn::Sub: s3://${CfnTemplateBucket}/bastion-assets
  Eks:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewEksCluster
    DependsOn:
    - Network
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/c04da2ab492204e3954594dcc7e2f28d.template
      Parameters:
        ProjectName: spendsmart
        NamePrefix:
          Ref: NamePrefix
        Environment: dev
        EksClusterName: spendsmart
        VpcId:
          Fn::GetAtt:
          - Network
          - Outputs.VpcId
        PrivateSubnet1Id:
          Fn::GetAtt:
          - Network
          - Outputs.PrivateSubnet1Id
        PrivateSubnet2Id:
          Fn::GetAtt:
          - Network
          - Outputs.PrivateSubnet2Id
        BastionSecurityGroupId: ''
  Db:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewEksCluster
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/11dd0c8bfc2dbe062d13e34f59fe14d6.template
      Parameters:
        NamePrefix:
          Ref: NamePrefix
  Alb:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewEksCluster
    DependsOn:
    - Network
    - Eks
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/0e346d2a14d395fc66c48dd51afb1699.template
      Parameters:
        ProjectName: spendsmart
        NamePrefix:
          Ref: NamePrefix
        Environment: dev
        VpcId:
          Fn::GetAtt:
          - Network
          - Outputs.VpcId
        PublicSubnet1Id:
          Fn::GetAtt:
          - Network
          - Outputs.PublicSubnet1Id
        PublicSubnet2Id:
          Fn::GetAtt:
          - Network
          - Outputs.PublicSubnet2Id
        PrivateSubnet1Id:
          Fn::GetAtt:
          - Network
          - Outputs.PrivateSubnet1Id
        PrivateSubnet2Id:
          Fn::GetAtt:
          - Network
          - Outputs.PrivateSubnet2Id
        EksClusterName: spendsmart
        NodesSecurityGroupId:
          Fn::GetAtt:
          - Eks
          - Outputs.EksNodesSecurityGroupId
        AlbName: spendsmart-dev-alb
        FrontendListenerPort: 8080
        FrontendTargetPort: 30080
        FrontendHealthCheckPath: /
        BackendListenerPort: 8081
        BackendTargetPort: 30081
        BackendHealthCheckPath: /api/v1/healthz
        KeycloakListenerPort: 8083
        KeycloakTargetPort: 30083
        KeycloakHealthCheckPath: /
        NodeGroup1Name:
          Fn::GetAtt:
          - Eks
          - Outputs.EksNodeGroup1Name
        NodeGroup2Name:
          Fn::GetAtt:
          - Eks
          - Outputs.EksNodeGroup2Name
  SpendSmart:
    Type: AWS::CloudFormation::Stack
    Condition: DeploySpendSmartApp
    DependsOn:
    - Eks
    - Db
    - Alb
    - Bastion
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/f725692a33e946d5a7eb25713b2b1945.template
      Parameters:
        NamePrefix:
          Ref: NamePrefix
        ClusterName: spendsmart
        ClusterSecurityGroupId:
          Fn::GetAtt:
          - Eks
          - Outputs.EksClusterSecurityGroupId
        VpcId:
          Fn::GetAtt:
          - Network
          - Outputs.VpcId
        PrivateSubnetId:
          Fn::GetAtt:
          - Network
          - Outputs.PrivateSubnet1Id
        AlbDnsName:
          Fn::GetAtt:
          - Alb
          - Outputs.AlbDnsName
        ClickHouseSecretName:
          Fn::Sub: ${NamePrefix}/clickhouse
        HarborUsername:
          Ref: HarborUsername
        HarborPassword:
          Ref: HarborPassword
  S3:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/80958831a606ecf7d1712074bb8b00ba.template
      Parameters:
        ProjectName: spendsmart
        Environment: dev
        S3BucketName:
          Ref: S3BucketName
  Glue:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/8e56e05823053ad1ce18e8be826ae833.template
      Parameters:
        NamePrefix:
          Ref: NamePrefix
        BucketArn:
          Fn::GetAtt:
          - S3
          - Outputs.BucketArn
  Athena:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/2ce15407b5b81ba049626d3f6c9744e9.template
      Parameters:
        BucketName:
          Fn::GetAtt:
          - S3
          - Outputs.BucketName
  Iam:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/3b6831e2234c9b4834f4559ddde84637.template
      Parameters:
        ProjectName: spendsmart
        NamePrefix:
          Ref: NamePrefix
        Environment: dev
        BucketArn:
          Fn::GetAtt:
          - S3
          - Outputs.BucketArn
        CurPrefix: cur
        AthenaResultsPrefix: athena-results
        BastionEnabled:
          Ref: BastionEnabled
        PostgresSecretName:
          Fn::Sub: ${NamePrefix}/postgres
        ClickHouseSecretName:
          Fn::Sub: ${NamePrefix}/clickhouse
        CfnArtifactsBucketName:
          Ref: CfnTemplateBucket
Outputs:
  Ec2KeyPairName:
    Value:
      Fn::If:
      - CreateNewEc2KeyPair
      - Ref: GeneratedEc2KeyPair
      - Ref: ExistingEc2KeyName
  VpcId:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Ref: ExistingEksVpcId
      - Fn::GetAtt:
        - Network
        - Outputs.VpcId
  VpcCidr:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.VpcCidr
  PublicSubnet1Id:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.PublicSubnet1Id
  PublicSubnet2Id:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.PublicSubnet2Id
  PrivateSubnet1Id:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Ref: ExistingEksPrivateSubnetId
      - Fn::GetAtt:
        - Network
        - Outputs.PrivateSubnet1Id
  PrivateSubnet2Id:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.PrivateSubnet2Id
  BastionInstanceId:
    Condition: CreateBastion
    Value:
      Fn::GetAtt:
      - Bastion
      - Outputs.BastionInstanceId
  BastionSecurityGroupId:
    Condition: CreateBastion
    Value:
      Fn::GetAtt:
      - Bastion
      - Outputs.BastionSecurityGroupId
  BastionPublicIp:
    Condition: CreateBastion
    Value:
      Fn::GetAtt:
      - Bastion
      - Outputs.BastionPublicIp
  EksClusterName:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Ref: ExistingEksClusterName
      - Fn::GetAtt:
        - Eks
        - Outputs.EksClusterName
  EksClusterEndpoint:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Eks
      - Outputs.EksClusterEndpoint
  EksClusterArn:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Fn::Sub: arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ExistingEksClusterName}
      - Fn::GetAtt:
        - Eks
        - Outputs.EksClusterArn
  EksClusterSecurityGroupId:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Ref: ExistingEksClusterSecurityGroupId
      - Fn::GetAtt:
        - Eks
        - Outputs.EksClusterSecurityGroupId
  EksNodesSecurityGroupId:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Eks
      - Outputs.EksNodesSecurityGroupId
  EksNodeGroupNames:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Eks
      - Outputs.EksNodeGroupNames
  EksConfigureKubectl:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Fn::Sub: aws eks update-kubeconfig --region ${AWS::Region} --name ${ExistingEksClusterName}
      - Fn::GetAtt:
        - Eks
        - Outputs.EksConfigureKubectl
  AlbControllerRoleArn:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Eks
      - Outputs.AlbControllerRoleArn
  PostgresEndpoint:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.PostgresEndpoint
  PostgresPort:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.PostgresPort
  PostgresDatabase:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.PostgresDatabase
  PostgresSecretArn:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.PostgresSecretArn
  ClickHouseEndpoint:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.ClickHouseEndpoint
  ClickHouseHttpPort:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.ClickHouseHttpPort
  ClickHouseNativePort:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.ClickHouseNativePort
  ClickHouseDatabase:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.ClickHouseDatabase
  ClickHouseSecretArn:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.ClickHouseSecretArn
  AlbDnsName:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Alb
      - Outputs.AlbDnsName
  SpendSmartFrontendUrl:
    Condition: DeploySpendSmartApp
    Value:
      Fn::GetAtt:
      - SpendSmart
      - Outputs.FrontendUrl
  SpendSmartBackendUrl:
    Condition: DeploySpendSmartApp
    Value:
      Fn::GetAtt:
      - SpendSmart
      - Outputs.BackendUrl
  SpendSmartKeycloakUrl:
    Condition: DeploySpendSmartApp
    Value:
      Fn::GetAtt:
      - SpendSmart
      - Outputs.KeycloakUrl
  BucketName:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.BucketName
  BucketArn:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.BucketArn
  DataLocation:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.DataLocation
  AthenaOutputLocation:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.AthenaOutputLocation
  CurReportName:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.CurReportName
  CurLocation:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.CurLocation
  CurAthenaDatabaseName:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.CurAthenaDatabaseName
  CurAthenaTableName:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.CurAthenaTableName
  GlueDatabaseName:
    Value:
      Fn::GetAtt:
      - Glue
      - Outputs.GlueDatabaseName
  GlueRoleArn:
    Value:
      Fn::GetAtt:
      - Glue
      - Outputs.GlueRoleArn
  AthenaWorkgroupName:
    Value:
      Fn::GetAtt:
      - Athena
      - Outputs.AthenaWorkgroupName
  AnalyticsIamRoleName:
    Value:
      Fn::GetAtt:
      - Iam
      - Outputs.AnalyticsIamRoleName
  AnalyticsIamRoleArn:
    Value:
      Fn::GetAtt:
      - Iam
      - Outputs.AnalyticsIamRoleArn
  AnalyticsIamPolicyName:
    Value:
      Fn::GetAtt:
      - Iam
      - Outputs.AnalyticsIamPolicyName
  AnalyticsIamPolicyArn:
    Value:
      Fn::GetAtt:
      - Iam
      - Outputs.AnalyticsIamPolicyArn
  PublicSubnetIds:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.PublicSubnetIds
  PrivateSubnetIds:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.PrivateSubnetIds
  NatGatewayIds:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.NatGatewayIds
  InternetGatewayId:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.InternetGatewayId
