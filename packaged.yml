AWSTemplateFormatVersion: '2010-09-09'
Description: SpendSmart root stack orchestrating nested infrastructure templates
Parameters:
  NamePrefix:
    Type: String
    Default: spendsmart-dev
  ExistingEc2KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: mukesh
    Description: Existing EC2 key pair in the deployment region.
  BastionSshCidrs:
    Type: CommaDelimitedList
    Default: 0.0.0.0/0,103.87.45.139/32
    Description: CIDR allowlist for SSH to the bastion.
  S3BucketName:
    Type: String
    Default: athena-results-spendsmart-dev
    Description: Must be globally unique.
  BastionEnabled:
    Type: String
    AllowedValues:
    - 'true'
    - 'false'
    Default: 'true'
  Ec2KeyPairMode:
    Type: String
    AllowedValues:
    - Existing
    - CreateNew
    Default: Existing
  NewEc2KeyPairName:
    Type: String
    Default: spendsmart-dev-generated
  EksClusterMode:
    Type: String
    AllowedValues:
    - CreateNew
    - UseExisting
    Default: CreateNew
  ExistingEksClusterName:
    Type: String
    Default: ''
  ExistingEksVpcId:
    Type: String
    Default: ''
  ExistingEksPrivateSubnetId:
    Type: String
    Default: ''
  ExistingEksClusterSecurityGroupId:
    Type: String
    Default: ''
  ExistingEksLoadBalancerControllerReady:
    Type: String
    AllowedValues:
    - 'true'
    - 'false'
    Default: 'false'
  SpendSmartWorkloadMode:
    Type: String
    AllowedValues:
    - InstallNew
    - LeaveExisting
    Default: LeaveExisting
Rules:
  ExistingEksInputsRequired:
    RuleCondition:
      Fn::Equals:
      - Ref: EksClusterMode
      - UseExisting
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ExistingEksClusterName
          - ''
      AssertDescription: ExistingEksClusterName is required in UseExisting mode.
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ExistingEksVpcId
          - ''
      AssertDescription: ExistingEksVpcId is required in UseExisting mode.
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ExistingEksPrivateSubnetId
          - ''
      AssertDescription: ExistingEksPrivateSubnetId is required in UseExisting mode.
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ExistingEksClusterSecurityGroupId
          - ''
      AssertDescription: ExistingEksClusterSecurityGroupId is required in UseExisting
        mode.
  ExistingEksControllerRequired:
    RuleCondition:
      Fn::And:
      - Fn::Equals:
        - Ref: EksClusterMode
        - UseExisting
      - Fn::Equals:
        - Ref: SpendSmartWorkloadMode
        - InstallNew
    Assertions:
    - Assert:
        Fn::Equals:
        - Ref: ExistingEksLoadBalancerControllerReady
        - 'true'
      AssertDescription: Install AWS Load Balancer Controller before installing SpendSmart
        into an existing cluster.
Conditions:
  CreateNewEc2KeyPair:
    Fn::Equals:
    - Ref: Ec2KeyPairMode
    - CreateNew
  CreateNewEksCluster:
    Fn::Equals:
    - Ref: EksClusterMode
    - CreateNew
  UseExistingEksCluster:
    Fn::Equals:
    - Ref: EksClusterMode
    - UseExisting
  InstallSpendSmart:
    Fn::Equals:
    - Ref: SpendSmartWorkloadMode
    - InstallNew
  CreateBastion:
    Fn::And:
    - Condition: CreateNewEksCluster
    - Fn::Equals:
      - Ref: BastionEnabled
      - 'true'
Resources:
  GeneratedEc2KeyPair:
    Type: AWS::EC2::KeyPair
    Condition: CreateNewEc2KeyPair
    Properties:
      KeyName:
        Ref: NewEc2KeyPairName
      KeyFormat: pem
      KeyType: rsa
  Network:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewEksCluster
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/282131d18c54faed619cb655505f4501.template
      Parameters:
        ProjectName: spendsmart
        NamePrefix:
          Ref: NamePrefix
        Environment: dev
        EksClusterName: spendsmart
  Bastion:
    Type: AWS::CloudFormation::Stack
    Condition: CreateBastion
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/272c47b942def7182737e515e3a60fae.template
      Parameters:
        NamePrefix:
          Ref: NamePrefix
        BastionEnabled:
          Ref: BastionEnabled
        Ec2KeyName:
          Fn::If:
          - CreateNewEc2KeyPair
          - Ref: GeneratedEc2KeyPair
          - Ref: ExistingEc2KeyName
        BastionSshCidrs:
          Fn::Join:
          - ','
          - Ref: BastionSshCidrs
        EksClusterName: spendsmart
        EksRegion:
          Ref: AWS::Region
        VpcId:
          Fn::GetAtt:
          - Network
          - Outputs.VpcId
        PublicSubnetId:
          Fn::GetAtt:
          - Network
          - Outputs.PublicSubnet1Id
  Eks:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewEksCluster
    DependsOn:
    - Network
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/ad31d17ee3377b22d6b67ede3b00b597.template
      Parameters:
        ProjectName: spendsmart
        NamePrefix:
          Ref: NamePrefix
        Environment: dev
        EksClusterName: spendsmart
        VpcId:
          Fn::GetAtt:
          - Network
          - Outputs.VpcId
        PrivateSubnet1Id:
          Fn::GetAtt:
          - Network
          - Outputs.PrivateSubnet1Id
        PrivateSubnet2Id:
          Fn::GetAtt:
          - Network
          - Outputs.PrivateSubnet2Id
        BastionSecurityGroupId:
          Fn::If:
          - CreateBastion
          - Fn::GetAtt:
            - Bastion
            - Outputs.BastionSecurityGroupId
          - ''
  Db:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewEksCluster
    DependsOn:
    - Eks
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/80bb997216a5194b81e4f357147a2d1c.template
      Parameters:
        NamePrefix:
          Ref: NamePrefix
        VpcId:
          Fn::GetAtt:
          - Network
          - Outputs.VpcId
        PrivateSubnet1Id:
          Fn::GetAtt:
          - Network
          - Outputs.PrivateSubnet1Id
        PrivateSubnet2Id:
          Fn::GetAtt:
          - Network
          - Outputs.PrivateSubnet2Id
        PrivateSubnet2AvailabilityZone:
          Fn::GetAtt:
          - Network
          - Outputs.PrivateSubnet2AvailabilityZone
        NodeGroup2SecurityGroupId:
          Fn::GetAtt:
          - Eks
          - Outputs.EksNodeGroup2SecurityGroupId
  Alb:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewEksCluster
    DependsOn:
    - Network
    - Eks
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/5ab8a67ea44f94789f140573eb26e48e.template
      Parameters:
        ProjectName: spendsmart
        NamePrefix:
          Ref: NamePrefix
        Environment: dev
        VpcId:
          Fn::GetAtt:
          - Network
          - Outputs.VpcId
        PublicSubnet1Id:
          Fn::GetAtt:
          - Network
          - Outputs.PublicSubnet1Id
        PublicSubnet2Id:
          Fn::GetAtt:
          - Network
          - Outputs.PublicSubnet2Id
        PrivateSubnet1Id:
          Fn::GetAtt:
          - Network
          - Outputs.PrivateSubnet1Id
        PrivateSubnet2Id:
          Fn::GetAtt:
          - Network
          - Outputs.PrivateSubnet2Id
        EksClusterName: spendsmart
        NodesSecurityGroupId:
          Fn::GetAtt:
          - Eks
          - Outputs.EksClusterSecurityGroupId
        AlbName: spendsmart-dev-alb
        AlbTargetGroupName: spendsmart-dev-tg
        AlbListenerPort: 80
        AlbTargetPort: 30080
        AlbHealthCheckPath: /healthz
        NodeGroup1Name:
          Fn::GetAtt:
          - Eks
          - Outputs.EksNodeGroup1Name
        NodeGroup2Name:
          Fn::GetAtt:
          - Eks
          - Outputs.EksNodeGroup2Name
  BastionEksAccessEntry:
    Type: AWS::EKS::AccessEntry
    Condition: CreateBastion
    DependsOn:
    - Eks
    - Bastion
    Properties:
      ClusterName:
        Fn::GetAtt:
        - Eks
        - Outputs.EksClusterName
      PrincipalArn:
        Fn::GetAtt:
        - Bastion
        - Outputs.BastionRoleArn
      Type: STANDARD
      AccessPolicies:
      - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
        AccessScope:
          Type: cluster
  SpendSmart:
    Type: AWS::CloudFormation::Stack
    Condition: InstallSpendSmart
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/1f46785436985ee89cc9cf97641d1d0b.template
      Parameters:
        ClusterName:
          Fn::If:
          - UseExistingEksCluster
          - Ref: ExistingEksClusterName
          - Fn::GetAtt:
            - Eks
            - Outputs.EksClusterName
        ClusterSecurityGroupId:
          Fn::If:
          - UseExistingEksCluster
          - Ref: ExistingEksClusterSecurityGroupId
          - Fn::GetAtt:
            - Eks
            - Outputs.EksClusterSecurityGroupId
        VpcId:
          Fn::If:
          - UseExistingEksCluster
          - Ref: ExistingEksVpcId
          - Fn::GetAtt:
            - Network
            - Outputs.VpcId
        PrivateSubnetId:
          Fn::If:
          - UseExistingEksCluster
          - Ref: ExistingEksPrivateSubnetId
          - Fn::GetAtt:
            - Network
            - Outputs.PrivateSubnet1Id
        InstallAlbController:
          Fn::If:
          - CreateNewEksCluster
          - 'true'
          - 'false'
        ChartRepository: https://github.com/OT-CONTAINER-KIT/helm-charts.git
        ChartBranch: feature/spendsmart-helm-chart
        Namespace: spendsmart
  S3:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/6d417da527733ebfd1b57c6938a49f5b.template
      Parameters:
        ProjectName: spendsmart
        Environment: dev
        S3BucketName:
          Ref: S3BucketName
  Glue:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/41be3066644c4deabd91d2c65bc63a66.template
      Parameters:
        NamePrefix:
          Ref: NamePrefix
        BucketArn:
          Fn::GetAtt:
          - S3
          - Outputs.BucketArn
  Athena:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/0fee92b7b46f5bf7a9b34569d6a27413.template
      Parameters:
        BucketName:
          Fn::GetAtt:
          - S3
          - Outputs.BucketName
  Iam:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/570bbcf858afd164e8ba4125a9ac6e69.template
      Parameters:
        ProjectName: spendsmart
        NamePrefix:
          Ref: NamePrefix
        Environment: dev
Outputs:
  Ec2KeyPairName:
    Value:
      Fn::If:
      - CreateNewEc2KeyPair
      - Ref: GeneratedEc2KeyPair
      - Ref: ExistingEc2KeyName
  VpcId:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Ref: ExistingEksVpcId
      - Fn::GetAtt:
        - Network
        - Outputs.VpcId
  VpcCidr:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.VpcCidr
  PublicSubnet1Id:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.PublicSubnet1Id
  PublicSubnet2Id:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.PublicSubnet2Id
  PrivateSubnet1Id:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Ref: ExistingEksPrivateSubnetId
      - Fn::GetAtt:
        - Network
        - Outputs.PrivateSubnet1Id
  PrivateSubnet2Id:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.PrivateSubnet2Id
  PublicSubnetIds:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.PublicSubnetIds
  PrivateSubnetIds:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.PrivateSubnetIds
  NatGatewayIds:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.NatGatewayIds
  InternetGatewayId:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.InternetGatewayId
  BastionInstanceId:
    Condition: CreateBastion
    Value:
      Fn::GetAtt:
      - Bastion
      - Outputs.BastionInstanceId
  BastionSecurityGroupId:
    Condition: CreateBastion
    Value:
      Fn::GetAtt:
      - Bastion
      - Outputs.BastionSecurityGroupId
  BastionPublicIp:
    Condition: CreateBastion
    Value:
      Fn::GetAtt:
      - Bastion
      - Outputs.BastionPublicIp
  EksClusterName:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Ref: ExistingEksClusterName
      - Fn::GetAtt:
        - Eks
        - Outputs.EksClusterName
  EksClusterEndpoint:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Eks
      - Outputs.EksClusterEndpoint
  EksClusterArn:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Fn::Sub: arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ExistingEksClusterName}
      - Fn::GetAtt:
        - Eks
        - Outputs.EksClusterArn
  EksClusterSecurityGroupId:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Ref: ExistingEksClusterSecurityGroupId
      - Fn::GetAtt:
        - Eks
        - Outputs.EksClusterSecurityGroupId
  EksNodesSecurityGroupId:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Eks
      - Outputs.EksNodesSecurityGroupId
  EksNodeGroup2SecurityGroupId:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Eks
      - Outputs.EksNodeGroup2SecurityGroupId
  EksNodeGroupNames:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Eks
      - Outputs.EksNodeGroupNames
  EksConfigureKubectl:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Fn::Sub: aws eks update-kubeconfig --region ${AWS::Region} --name ${ExistingEksClusterName}
      - Fn::GetAtt:
        - Eks
        - Outputs.EksConfigureKubectl
  AlbControllerRoleArn:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Eks
      - Outputs.AlbControllerRoleArn
  SpendSmartDeploymentHostId:
    Condition: InstallSpendSmart
    Value:
      Fn::GetAtt:
      - SpendSmart
      - Outputs.DeploymentHostId
  SpendSmartNamespace:
    Condition: InstallSpendSmart
    Value:
      Fn::GetAtt:
      - SpendSmart
      - Outputs.Namespace
  SpendSmartIngressName:
    Condition: InstallSpendSmart
    Value:
      Fn::GetAtt:
      - SpendSmart
      - Outputs.IngressName
  PostgresEndpoint:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.PostgresEndpoint
  PostgresPort:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.PostgresPort
  PostgresDatabase:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.PostgresDatabase
  PostgresSecretArn:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.PostgresSecretArn
  ClickHousePrivateIp:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.ClickHousePrivateIp
  ClickHouseHttpPort:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.ClickHouseHttpPort
  ClickHouseNativePort:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.ClickHouseNativePort
  ClickHouseDatabase:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.ClickHouseDatabase
  ClickHouseSecretArn:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.ClickHouseSecretArn
  BucketName:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.BucketName
  BucketArn:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.BucketArn
  DataLocation:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.DataLocation
  AthenaOutputLocation:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.AthenaOutputLocation
  GlueDatabaseName:
    Value:
      Fn::GetAtt:
      - Glue
      - Outputs.GlueDatabaseName
  GlueRoleArn:
    Value:
      Fn::GetAtt:
      - Glue
      - Outputs.GlueRoleArn
  AthenaWorkgroupName:
    Value:
      Fn::GetAtt:
      - Athena
      - Outputs.AthenaWorkgroupName
  AnalyticsIamRoleName:
    Value:
      Fn::GetAtt:
      - Iam
      - Outputs.AnalyticsIamRoleName
  AnalyticsIamRoleArn:
    Value:
      Fn::GetAtt:
      - Iam
      - Outputs.AnalyticsIamRoleArn
  AnalyticsIamPolicyName:
    Value:
      Fn::GetAtt:
      - Iam
      - Outputs.AnalyticsIamPolicyName
  AnalyticsIamPolicyArn:
    Value:
      Fn::GetAtt:
      - Iam
      - Outputs.AnalyticsIamPolicyArn
