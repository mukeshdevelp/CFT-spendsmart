AWSTemplateFormatVersion: '2010-09-09'
Description: SpendSmart root stack orchestrating nested infrastructure templates
Parameters:
  NamePrefix:
    Type: String
    Default: spendsmart-dev
  ExistingEc2KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: mukesh
    Description: Existing EC2 key pair in the deployment region.
  BastionSshCidrs:
    Type: CommaDelimitedList
    Default: 0.0.0.0/0,162.120.184.0/32
    Description: CIDR allowlist for SSH to the bastion.
  S3BucketName:
    Type: String
    Default: athena-results-spendsmart-dev
    Description: Data, Athena results, and CUR bucket (created by stack; deleted on
      rollback when empty).
  BastionEnabled:
    Type: String
    AllowedValues:
    - 'true'
    - 'false'
    Default: 'true'
  Ec2KeyPairMode:
    Type: String
    AllowedValues:
    - Existing
    - CreateNew
    Default: Existing
  NewEc2KeyPairName:
    Type: String
    Default: spendsmart-dev-generated
  EksClusterMode:
    Type: String
    AllowedValues:
    - CreateNew
    - UseExisting
    Default: CreateNew
  ExistingEksClusterName:
    Type: String
    Default: ''
  ExistingEksVpcId:
    Type: String
    Default: ''
  ExistingEksPrivateSubnetId:
    Type: String
    Default: ''
  ExistingEksClusterSecurityGroupId:
    Type: String
    Default: ''
  ExistingEksLoadBalancerControllerReady:
    Type: String
    AllowedValues:
    - 'true'
    - 'false'
    Default: 'false'
  SpendSmartWorkloadMode:
    Type: String
    AllowedValues:
    - InstallNew
    - LeaveExisting
    Default: LeaveExisting
    Description: LeaveExisting deploys infra only; use helm-main.yml or Jenkinsfile.helm
      for the chart.
  SpendSmartValuesS3Uri:
    Type: String
    Default: ''
    Description: Optional S3 URI to client-a-values.yaml. When empty, values are generated
      from stack outputs.
Rules:
  ExistingEksInputsRequired:
    RuleCondition:
      Fn::Equals:
      - Ref: EksClusterMode
      - UseExisting
    Assertions:
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ExistingEksClusterName
          - ''
      AssertDescription: ExistingEksClusterName is required in UseExisting mode.
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ExistingEksVpcId
          - ''
      AssertDescription: ExistingEksVpcId is required in UseExisting mode.
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ExistingEksPrivateSubnetId
          - ''
      AssertDescription: ExistingEksPrivateSubnetId is required in UseExisting mode.
    - Assert:
        Fn::Not:
        - Fn::Equals:
          - Ref: ExistingEksClusterSecurityGroupId
          - ''
      AssertDescription: ExistingEksClusterSecurityGroupId is required in UseExisting
        mode.
  ExistingEksControllerRequired:
    RuleCondition:
      Fn::And:
      - Fn::Equals:
        - Ref: EksClusterMode
        - UseExisting
      - Fn::Equals:
        - Ref: SpendSmartWorkloadMode
        - InstallNew
    Assertions:
    - Assert:
        Fn::Equals:
        - Ref: ExistingEksLoadBalancerControllerReady
        - 'true'
      AssertDescription: Install AWS Load Balancer Controller before installing SpendSmart
        into an existing cluster.
Conditions:
  CreateNewEc2KeyPair:
    Fn::Equals:
    - Ref: Ec2KeyPairMode
    - CreateNew
  CreateNewEksCluster:
    Fn::Equals:
    - Ref: EksClusterMode
    - CreateNew
  UseExistingEksCluster:
    Fn::Equals:
    - Ref: EksClusterMode
    - UseExisting
  InstallSpendSmart:
    Fn::Equals:
    - Ref: SpendSmartWorkloadMode
    - InstallNew
  InstallSpendSmartOnNewCluster:
    Fn::And:
    - Condition: InstallSpendSmart
    - Condition: CreateNewEksCluster
  CreateBastion:
    Fn::And:
    - Condition: CreateNewEksCluster
    - Fn::Equals:
      - Ref: BastionEnabled
      - 'true'
Resources:
  GeneratedEc2KeyPair:
    Type: AWS::EC2::KeyPair
    Condition: CreateNewEc2KeyPair
    Properties:
      KeyName:
        Ref: NewEc2KeyPairName
      KeyFormat: pem
      KeyType: rsa
  Network:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewEksCluster
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/c9943b6f23b1d4599a33b2424eec411d.template
      Parameters:
        ProjectName: spendsmart
        NamePrefix:
          Ref: NamePrefix
        Environment: dev
        EksClusterName: spendsmart
  Bastion:
    Type: AWS::CloudFormation::Stack
    Condition: CreateBastion
    DependsOn:
    - Network
    - Eks
    - Db
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/0066df9bdeb020c71b53ffd8616768ba.template
      Parameters:
        NamePrefix:
          Ref: NamePrefix
        BastionEnabled:
          Ref: BastionEnabled
        Ec2KeyName:
          Fn::If:
          - CreateNewEc2KeyPair
          - Ref: GeneratedEc2KeyPair
          - Ref: ExistingEc2KeyName
        BastionSshCidrs:
          Fn::Join:
          - ','
          - Ref: BastionSshCidrs
        EksClusterName: spendsmart
        EksRegion:
          Ref: AWS::Region
        VpcId:
          Fn::GetAtt:
          - Network
          - Outputs.VpcId
        PublicSubnetId:
          Fn::GetAtt:
          - Network
          - Outputs.PublicSubnet1Id
        PostgresSecretName:
          Fn::Sub: ${NamePrefix}/postgres
        ClickHouseSecretName:
          Fn::Sub: ${NamePrefix}/clickhouse
  Eks:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewEksCluster
    DependsOn:
    - Network
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/c04da2ab492204e3954594dcc7e2f28d.template
      Parameters:
        ProjectName: spendsmart
        NamePrefix:
          Ref: NamePrefix
        Environment: dev
        EksClusterName: spendsmart
        VpcId:
          Fn::GetAtt:
          - Network
          - Outputs.VpcId
        PrivateSubnet1Id:
          Fn::GetAtt:
          - Network
          - Outputs.PrivateSubnet1Id
        PrivateSubnet2Id:
          Fn::GetAtt:
          - Network
          - Outputs.PrivateSubnet2Id
        BastionSecurityGroupId: ''
  Db:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewEksCluster
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/3dbdca95a8845a7156e0a08d05ea2ef1.template
      Parameters:
        NamePrefix:
          Ref: NamePrefix
  Alb:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNewEksCluster
    DependsOn:
    - Network
    - Eks
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/38d86c05953e5b96f628a550d192d4e0.template
      Parameters:
        ProjectName: spendsmart
        NamePrefix:
          Ref: NamePrefix
        Environment: dev
        VpcId:
          Fn::GetAtt:
          - Network
          - Outputs.VpcId
        PublicSubnet1Id:
          Fn::GetAtt:
          - Network
          - Outputs.PublicSubnet1Id
        PublicSubnet2Id:
          Fn::GetAtt:
          - Network
          - Outputs.PublicSubnet2Id
        PrivateSubnet1Id:
          Fn::GetAtt:
          - Network
          - Outputs.PrivateSubnet1Id
        PrivateSubnet2Id:
          Fn::GetAtt:
          - Network
          - Outputs.PrivateSubnet2Id
        EksClusterName: spendsmart
        NodesSecurityGroupId:
          Fn::GetAtt:
          - Eks
          - Outputs.EksNodesSecurityGroupId
        AlbName: spendsmart-dev-alb
        AlbTargetGroupName: spendsmart-dev-tg
        AlbListenerPort: 80
        AlbTargetPort: 30080
        AlbHealthCheckPath: /healthz
        NodeGroup1Name:
          Fn::GetAtt:
          - Eks
          - Outputs.EksNodeGroup1Name
        NodeGroup2Name:
          Fn::GetAtt:
          - Eks
          - Outputs.EksNodeGroup2Name
  BastionSshToEksNodes:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CreateBastion
    DependsOn:
    - Eks
    - Bastion
    Properties:
      GroupId:
        Fn::GetAtt:
        - Eks
        - Outputs.EksNodesSecurityGroupId
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      SourceSecurityGroupId:
        Fn::GetAtt:
        - Bastion
        - Outputs.BastionSecurityGroupId
      Description: SSH from bastion to EKS worker nodes
  BastionHttpsToEksApi:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CreateBastion
    DependsOn:
    - Eks
    - Bastion
    Properties:
      GroupId:
        Fn::GetAtt:
        - Eks
        - Outputs.EksClusterSecurityGroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId:
        Fn::GetAtt:
        - Bastion
        - Outputs.BastionSecurityGroupId
      Description: HTTPS from bastion to EKS API
  BastionHttpsToEksNodes:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: CreateBastion
    DependsOn:
    - Eks
    - Bastion
    Properties:
      GroupId:
        Fn::GetAtt:
        - Eks
        - Outputs.EksNodesSecurityGroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId:
        Fn::GetAtt:
        - Bastion
        - Outputs.BastionSecurityGroupId
      Description: HTTPS from bastion to worker nodes
  SpendSmart:
    Type: AWS::CloudFormation::Stack
    Condition: InstallSpendSmartOnNewCluster
    DependsOn:
    - Alb
    - Db
    - Eks
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/3113544d853ebd36e62b819f275937ab.template
      Parameters:
        NamePrefix:
          Ref: NamePrefix
        ClusterName:
          Fn::If:
          - UseExistingEksCluster
          - Ref: ExistingEksClusterName
          - Fn::GetAtt:
            - Eks
            - Outputs.EksClusterName
        ClusterSecurityGroupId:
          Fn::If:
          - UseExistingEksCluster
          - Ref: ExistingEksClusterSecurityGroupId
          - Fn::GetAtt:
            - Eks
            - Outputs.EksClusterSecurityGroupId
        VpcId:
          Fn::If:
          - UseExistingEksCluster
          - Ref: ExistingEksVpcId
          - Fn::GetAtt:
            - Network
            - Outputs.VpcId
        PrivateSubnetId:
          Fn::If:
          - UseExistingEksCluster
          - Ref: ExistingEksPrivateSubnetId
          - Fn::GetAtt:
            - Network
            - Outputs.PrivateSubnet1Id
        InstallAlbController:
          Fn::If:
          - CreateNewEksCluster
          - 'true'
          - 'false'
        ChartRepository: https://github.com/OT-CONTAINER-KIT/helm-charts.git
        ChartBranch: feature/spendsmart-helm-chart
        Namespace: spendsmart
        AlbDnsName:
          Fn::GetAtt:
          - Alb
          - Outputs.AlbDnsName
        PostgresSecretName:
          Fn::Sub: ${NamePrefix}/postgres
        ClickHouseSecretName:
          Fn::Sub: ${NamePrefix}/clickhouse
        ValuesS3Uri:
          Ref: SpendSmartValuesS3Uri
  S3:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/80958831a606ecf7d1712074bb8b00ba.template
      Parameters:
        ProjectName: spendsmart
        Environment: dev
        S3BucketName:
          Ref: S3BucketName
  Glue:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/8e56e05823053ad1ce18e8be826ae833.template
      Parameters:
        NamePrefix:
          Ref: NamePrefix
        BucketArn:
          Fn::GetAtt:
          - S3
          - Outputs.BucketArn
  Athena:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/2ce15407b5b81ba049626d3f6c9744e9.template
      Parameters:
        BucketName:
          Fn::GetAtt:
          - S3
          - Outputs.BucketName
  Iam:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/spendsmart-cfn-packages/2222302e977b47fdf3882e2e4fb1174c.template
      Parameters:
        ProjectName: spendsmart
        NamePrefix:
          Ref: NamePrefix
        Environment: dev
        BucketArn:
          Fn::GetAtt:
          - S3
          - Outputs.BucketArn
        CurPrefix: cur
        AthenaResultsPrefix: athena-results
Outputs:
  Ec2KeyPairName:
    Value:
      Fn::If:
      - CreateNewEc2KeyPair
      - Ref: GeneratedEc2KeyPair
      - Ref: ExistingEc2KeyName
  VpcId:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Ref: ExistingEksVpcId
      - Fn::GetAtt:
        - Network
        - Outputs.VpcId
  VpcCidr:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.VpcCidr
  PublicSubnet1Id:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.PublicSubnet1Id
  PublicSubnet2Id:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.PublicSubnet2Id
  PrivateSubnet1Id:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Ref: ExistingEksPrivateSubnetId
      - Fn::GetAtt:
        - Network
        - Outputs.PrivateSubnet1Id
  PrivateSubnet2Id:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.PrivateSubnet2Id
  BastionInstanceId:
    Condition: CreateBastion
    Value:
      Fn::GetAtt:
      - Bastion
      - Outputs.BastionInstanceId
  BastionSecurityGroupId:
    Condition: CreateBastion
    Value:
      Fn::GetAtt:
      - Bastion
      - Outputs.BastionSecurityGroupId
  BastionPublicIp:
    Condition: CreateBastion
    Value:
      Fn::GetAtt:
      - Bastion
      - Outputs.BastionPublicIp
  EksClusterName:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Ref: ExistingEksClusterName
      - Fn::GetAtt:
        - Eks
        - Outputs.EksClusterName
  EksClusterEndpoint:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Eks
      - Outputs.EksClusterEndpoint
  EksClusterArn:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Fn::Sub: arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ExistingEksClusterName}
      - Fn::GetAtt:
        - Eks
        - Outputs.EksClusterArn
  EksClusterSecurityGroupId:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Ref: ExistingEksClusterSecurityGroupId
      - Fn::GetAtt:
        - Eks
        - Outputs.EksClusterSecurityGroupId
  EksNodesSecurityGroupId:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Eks
      - Outputs.EksNodesSecurityGroupId
  EksNodeGroupNames:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Eks
      - Outputs.EksNodeGroupNames
  EksConfigureKubectl:
    Value:
      Fn::If:
      - UseExistingEksCluster
      - Fn::Sub: aws eks update-kubeconfig --region ${AWS::Region} --name ${ExistingEksClusterName}
      - Fn::GetAtt:
        - Eks
        - Outputs.EksConfigureKubectl
  AlbControllerRoleArn:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Eks
      - Outputs.AlbControllerRoleArn
  SpendSmartDeploymentHostId:
    Condition: InstallSpendSmartOnNewCluster
    Value:
      Fn::GetAtt:
      - SpendSmart
      - Outputs.DeploymentHostId
  SpendSmartNamespace:
    Condition: InstallSpendSmartOnNewCluster
    Value:
      Fn::GetAtt:
      - SpendSmart
      - Outputs.Namespace
  SpendSmartIngressName:
    Condition: InstallSpendSmartOnNewCluster
    Value:
      Fn::GetAtt:
      - SpendSmart
      - Outputs.IngressName
  PostgresEndpoint:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.PostgresEndpoint
  PostgresPort:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.PostgresPort
  PostgresDatabase:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.PostgresDatabase
  PostgresSecretArn:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.PostgresSecretArn
  ClickHouseEndpoint:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.ClickHouseEndpoint
  ClickHouseHttpPort:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.ClickHouseHttpPort
  ClickHouseNativePort:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.ClickHouseNativePort
  ClickHouseDatabase:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.ClickHouseDatabase
  ClickHouseSecretArn:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Db
      - Outputs.ClickHouseSecretArn
  AlbDnsName:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Alb
      - Outputs.AlbDnsName
  BucketName:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.BucketName
  BucketArn:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.BucketArn
  DataLocation:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.DataLocation
  AthenaOutputLocation:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.AthenaOutputLocation
  CurReportName:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.CurReportName
  CurLocation:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.CurLocation
  CurAthenaDatabaseName:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.CurAthenaDatabaseName
  CurAthenaTableName:
    Value:
      Fn::GetAtt:
      - S3
      - Outputs.CurAthenaTableName
  GlueDatabaseName:
    Value:
      Fn::GetAtt:
      - Glue
      - Outputs.GlueDatabaseName
  GlueRoleArn:
    Value:
      Fn::GetAtt:
      - Glue
      - Outputs.GlueRoleArn
  AthenaWorkgroupName:
    Value:
      Fn::GetAtt:
      - Athena
      - Outputs.AthenaWorkgroupName
  AnalyticsIamRoleName:
    Value:
      Fn::GetAtt:
      - Iam
      - Outputs.AnalyticsIamRoleName
  AnalyticsIamRoleArn:
    Value:
      Fn::GetAtt:
      - Iam
      - Outputs.AnalyticsIamRoleArn
  AnalyticsIamPolicyName:
    Value:
      Fn::GetAtt:
      - Iam
      - Outputs.AnalyticsIamPolicyName
  AnalyticsIamPolicyArn:
    Value:
      Fn::GetAtt:
      - Iam
      - Outputs.AnalyticsIamPolicyArn
  PublicSubnetIds:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.PublicSubnetIds
  PrivateSubnetIds:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.PrivateSubnetIds
  NatGatewayIds:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.NatGatewayIds
  InternetGatewayId:
    Condition: CreateNewEksCluster
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.InternetGatewayId
