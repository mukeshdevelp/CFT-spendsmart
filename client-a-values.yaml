# SpendSmart Helm overrides (OT-CONTAINER-KIT charts/spendsmart).
# Deploy: create K8s secrets (Harbor, encryption-key, clickhouse, clickhouse-db) then:
#   helm upgrade --install spendsmart <chart> -n spendsmart -f client-a-values.yaml --wait
# EKS: pipeline runs scripts/prepare-helm-values.py to set VITE_* to http://<AlbDnsName> (ALB port 80).

imagePullSecrets:
  - name: harbor-ldc-coe-regcred

backend:
  image:
    repository: harbor.ldc.opstree.dev/coe/uniteconpro-backend-prod
    tag: latest
  nodeSelector:
    spendsmart.io/workload: backend
  annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  image:
    repository: harbor.ldc.opstree.dev/coe/uniteconpro-frontend-prod
    tag: latest
  nodeSelector:
    spendsmart.io/workload: frontend
  service:
    type: NodePort
    port: 80
    targetPort: 80
  configMap:
    data:
      VITE_API_BASE_URL: ""
      VITE_CLOUD_SENTRY_API_BASE_URL: ""
      VITE_KEYCLOAK_CLIENT_ID: "spendsmart-frontend"
      VITE_KEYCLOAK_REALM: "spendsmart"
      VITE_KEYCLOAK_URL: ""
  nginx:
    csp:
      connectSrc:
        - "'self'"
        - "wss:"
      frameSrc:
        - "'self'"
        - "https:"
  annotations: {}

cloudsentry:
  enabled: false

engine:
  enabled: true
  image:
    repository: harbor.ldc.opstree.dev/coe/uniteconpro-engine-dev
    tag: latest
  schedule: "5 11,23 * * *"
  nodeSelector:
    spendsmart.io/workload: backend
  annotations: {}
