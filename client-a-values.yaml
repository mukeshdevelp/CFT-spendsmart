# SpendSmart Helm values (OT-CONTAINER-KIT chart). Matches local client-a-file.yml layout.
# Images: harbor.ldc.opstree.dev — EKS pulls via harbor-ldc-coe-regcred (pipeline step 6).
# Optional: set VITE_* URLs when Keycloak/ALB are ready; empty strings match local guide step 16.

backend:
  image:
    repository: harbor.ldc.opstree.dev/coe/uniteconpro-backend-prod
    tag: latest
  nodeSelector:
    spendsmart.io/workload: backend
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  image:
    repository: harbor.ldc.opstree.dev/coe/uniteconpro-frontend-prod
    tag: latest
  nodeSelector:
    spendsmart.io/workload: frontend
  service:
    type: NodePort
  configMap:
    data:
      VITE_API_BASE_URL: ""
      VITE_CLOUD_SENTRY_API_BASE_URL: ""
      VITE_KEYCLOAK_CLIENT_ID: ""
      VITE_KEYCLOAK_REALM: ""
      VITE_KEYCLOAK_URL: ""
  nginx:
    csp:
      connectSrc:
        - "'self'"
        - "wss:"
      frameSrc:
        - "'self'"
        - "https:"

cloudsentry:
  enabled: false

engine:
  enabled: true
  image:
    repository: harbor.ldc.opstree.dev/coe/uniteconpro-engine-dev
    tag: latest
  schedule: "5 11,23 * * *"
  nodeSelector:
    spendsmart.io/workload: backend
