---
- name: Resolve CloudFormation outputs and Helm values (control node)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Load optional secrets vars file
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/secrets.yml"
      ignore_errors: true

    - name: Get CloudFormation stack info
      amazon.aws.cloudformation_info:
        region: "{{ aws_region }}"
        stack_name: "{{ cfn_stack_name }}"
      register: cfn_stack

    - name: Assert infra stack is ready
      ansible.builtin.assert:
        that:
          - cfn_stack.cloudformation[cfn_stack_name].stack_status in ['CREATE_COMPLETE', 'UPDATE_COMPLETE']
        fail_msg: "Stack {{ cfn_stack_name }} is not ready"

    - name: Cache stack outputs for bastion play
      ansible.builtin.set_fact:
        spendsmart_cfn_outputs: "{{ cfn_stack.cloudformation[cfn_stack_name].stack_outputs | default({}) }}"
        cacheable: true

    - name: Render Helm values (copy client-a-values only)
      ansible.builtin.command:
        cmd: cp {{ client_values_file }} {{ rendered_values_file }}
      changed_when: true
      when: not (inject_cfn_urls | default(false) | bool)

    - name: Render Helm values with ALB DNS (chart README + EKS ALB)
      ansible.builtin.command:
        cmd: >
          python3 {{ playbook_dir }}/../../scripts/prepare-helm-values.py
          --base-values {{ client_values_file }}
          --out {{ rendered_values_file }}
          --context-out /tmp/spendsmart-helm-deploy-context.env
          --namespace {{ k8s_namespace }}
          --stack-name {{ cfn_stack_name }}
          --region {{ aws_region }}
          --alb-listener-port {{ alb_listener_port }}
          --alb-target-port {{ alb_target_port }}
          --inject-urls
      environment:
        KEYCLOAK_REALM: "{{ keycloak_realm | default('spendsmart') }}"
        KEYCLOAK_CLIENT_ID: "{{ keycloak_client_id | default('spendsmart-frontend') }}"
        KEYCLOAK_BROWSER_URL: "{{ keycloak_browser_url | default('') }}"
        CLOUDSENTRY_URL: "{{ cloudsentry_url | default('') }}"
      when: inject_cfn_urls | default(false) | bool

    - name: Load rendered values for bastion
      ansible.builtin.slurp:
        src: "{{ rendered_values_file }}"
      register: spendsmart_rendered_values

    - name: Cache Helm values and frontend URL for bastion
      ansible.builtin.set_fact:
        spendsmart_helm_values_yaml: "{{ spendsmart_rendered_values.content | b64decode }}"
        spendsmart_frontend_base_url: >-
          {{
            ('http://' + spendsmart_cfn_outputs.get('AlbDnsName', ''))
            if (inject_cfn_urls | default(false) | bool and spendsmart_cfn_outputs.get('AlbDnsName', ''))
            else ''
          }}
        cacheable: true

- name: Deploy SpendSmart on bastion (kubectl / Helm)
  hosts: bastion
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Load optional secrets vars file
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/secrets.yml"
      ignore_errors: true
  vars:
    cfn_outputs: "{{ hostvars['localhost']['spendsmart_cfn_outputs'] }}"
    frontend_base_url: "{{ hostvars['localhost']['spendsmart_frontend_base_url'] }}"
    helm_values_yaml: "{{ hostvars['localhost']['spendsmart_helm_values_yaml'] }}"
  roles:
    - spendsmart_helm
