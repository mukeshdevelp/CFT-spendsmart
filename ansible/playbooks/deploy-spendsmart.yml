---
- name: Resolve CloudFormation outputs and Helm values (control node)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Load optional secrets vars file
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/secrets.yml"
      ignore_errors: true

    - name: Get CloudFormation stack info
      amazon.aws.cloudformation_info:
        region: "{{ aws_region }}"
        stack_name: "{{ cfn_stack_name }}"
      register: cfn_stack

    - name: Assert infra stack is ready
      ansible.builtin.assert:
        that:
          - cfn_stack.cloudformation[cfn_stack_name].stack_status in ['CREATE_COMPLETE', 'UPDATE_COMPLETE']
        fail_msg: "Stack {{ cfn_stack_name }} is not ready"

    - name: Cache stack outputs for bastion play
      ansible.builtin.set_fact:
        spendsmart_cfn_outputs: "{{ cfn_stack.cloudformation[cfn_stack_name].stack_outputs | default({}) }}"
        cacheable: true

    - name: Resolve ALB DNS
      ansible.builtin.set_fact:
        spendsmart_alb_dns: "{{ spendsmart_cfn_outputs.get('AlbDnsName', '') }}"
        spendsmart_frontend_base_url: "{{ ('http://' + spendsmart_cfn_outputs.get('AlbDnsName', '')) if spendsmart_cfn_outputs.get('AlbDnsName', '') else '' }}"
        cacheable: true

    - name: Resolve Keycloak URL for Helm values
      ansible.builtin.set_fact:
        spendsmart_vite_keycloak_url: >-
          {{
            keycloak_browser_url
            if (keycloak_browser_url | default('') | length > 0)
            else (
              ('http://keycloak.' + k8s_namespace + '.svc.cluster.local:8080')
              if (keycloak_url | default('auto')) in ['auto', '']
              else keycloak_url | replace('{namespace}', k8s_namespace)
            )
          }}
        cacheable: true

    - name: Read base Helm values from repo
      ansible.builtin.slurp:
        src: "{{ client_values_file }}"
      register: spendsmart_base_values

    - name: Build rendered Helm values YAML
      ansible.builtin.set_fact:
        spendsmart_helm_values_yaml: >-
          {{
            (spendsmart_base_values.content | b64decode)
            | replace('PLACEHOLDER_API_URL', spendsmart_frontend_base_url)
            | replace('PLACEHOLDER_CLOUDSENTRY_URL', cloudsentry_url | default(''))
            | replace('PLACEHOLDER_KEYCLOAK_URL', spendsmart_vite_keycloak_url)
          }}
        cacheable: true

- name: Deploy SpendSmart on bastion (kubectl / Helm)
  hosts: bastion
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Load optional secrets vars file
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/secrets.yml"
      ignore_errors: true
  vars:
    cfn_outputs: "{{ hostvars['localhost']['spendsmart_cfn_outputs'] }}"
    frontend_base_url: "{{ hostvars['localhost']['spendsmart_frontend_base_url'] }}"
    helm_values_yaml: "{{ hostvars['localhost']['spendsmart_helm_values_yaml'] }}"
  roles:
    - spendsmart_helm
