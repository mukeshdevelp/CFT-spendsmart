---
- name: Resolve CloudFormation outputs and Helm values (control node)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
  tasks:
    - name: Load optional secrets vars file
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/secrets.yml"
      ignore_errors: true

    - name: Get CloudFormation stack info
      amazon.aws.cloudformation_info:
        region: "{{ aws_region }}"
        stack_name: "{{ cfn_stack_name }}"
      register: cfn_stack

    - name: Assert infra stack is ready
      ansible.builtin.assert:
        that:
          - cfn_stack.cloudformation[cfn_stack_name].stack_status in ['CREATE_COMPLETE', 'UPDATE_COMPLETE']
        fail_msg: "Stack {{ cfn_stack_name }} is not ready"

    - name: Cache stack outputs for bastion play
      ansible.builtin.set_fact:
        spendsmart_cfn_outputs: "{{ cfn_stack.cloudformation[cfn_stack_name].stack_outputs | default({}) }}"
        cacheable: true

    - name: Read Helm values (client-a-values.yaml — guide step 16)
      ansible.builtin.slurp:
        src: "{{ client_values_file }}"
      register: spendsmart_base_values

    - name: Use values as-is (guide empty VITE_*)
      ansible.builtin.set_fact:
        spendsmart_helm_values_yaml: "{{ spendsmart_base_values.content | b64decode }}"
        spendsmart_frontend_base_url: ""
        cacheable: true
      when: not (inject_cfn_urls | default(false) | bool)

    - name: Optional inject API URL from AlbDnsName
      when: inject_cfn_urls | default(false) | bool
      block:
        - name: Resolve ALB DNS
          ansible.builtin.set_fact:
            spendsmart_frontend_base_url: >-
              {{ 'http://' + spendsmart_cfn_outputs.get('AlbDnsName', '')
                 if spendsmart_cfn_outputs.get('AlbDnsName', '') else '' }}
            cacheable: true

        - name: Patch VITE_API_BASE_URL in values YAML
          ansible.builtin.set_fact:
            spendsmart_helm_values_yaml: >-
              {{
                (spendsmart_base_values.content | b64decode)
                | regex_replace('VITE_API_BASE_URL: ""', 'VITE_API_BASE_URL: "' + spendsmart_frontend_base_url + '"', 1)
              }}
            cacheable: true

- name: Deploy SpendSmart on bastion (kubectl / Helm)
  hosts: bastion
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
  pre_tasks:
    - name: Load optional secrets vars file
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../group_vars/secrets.yml"
      ignore_errors: true
  vars:
    cfn_outputs: "{{ hostvars['localhost']['spendsmart_cfn_outputs'] }}"
    frontend_base_url: "{{ hostvars['localhost']['spendsmart_frontend_base_url'] }}"
    helm_values_yaml: "{{ hostvars['localhost']['spendsmart_helm_values_yaml'] }}"
  roles:
    - spendsmart_helm
