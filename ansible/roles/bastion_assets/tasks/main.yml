---
- name: Upload bastion bootstrap assets
  amazon.aws.s3_object:
    bucket: "{{ cfn_template_bucket }}"
    object: "bastion-assets/{{ item.name }}"
    src: "{{ repo_root }}/{{ item.path }}"
    mode: put
    region: "{{ aws_region }}"
  loop:
    - name: cluster-bootstrap.sh
      path: modules/bastion/scripts/cluster-bootstrap.sh
    - name: databases.yaml
      path: modules/bastion/manifests/databases.yaml
