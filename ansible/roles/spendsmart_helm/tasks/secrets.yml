---
- name: Fetch ClickHouse password from Secrets Manager
  ansible.builtin.set_fact:
    clickhouse_password: >-
      {{ (lookup('amazon.aws.aws_secret',
                 name_prefix + '/clickhouse',
                 region=aws_region) | from_json).password }}
  no_log: true

- name: Ensure application namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ k8s_namespace }}"

- name: Render Harbor dockerconfig
  ansible.builtin.set_fact:
    harbor_dockerconfig_json: "{{ lookup('template', 'dockerconfig.json.j2') }}"
  no_log: true

- name: Harbor image-pull secret (harbor-ldc-coe-regcred)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: harbor-ldc-coe-regcred
        namespace: "{{ k8s_namespace }}"
      type: kubernetes.io/dockerconfigjson
      stringData:
        .dockerconfigjson: "{{ harbor_dockerconfig_json }}"
  no_log: true

- name: encryption-key secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: encryption-key
        namespace: "{{ k8s_namespace }}"
      stringData:
        ENCRYPTION_KEY: "{{ encryption_key }}"
  no_log: true

- name: clickhouse secret (backend — 7 keys per deploy guide step 12)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: clickhouse
        namespace: "{{ k8s_namespace }}"
      stringData:
        CLICKHOUSE_HOST: "{{ clickhouse_host }}"
        CLICKHOUSE_PORT: "{{ clickhouse_port }}"
        CLICKHOUSE_USER: "{{ clickhouse_user }}"
        CLICKHOUSE_PASSWORD: "{{ clickhouse_password }}"
        CLICKHOUSE_DATABASE: "{{ clickhouse_database }}"
        CLICKHOUSE_TABLE: "{{ clickhouse_table }}"
        CLICKHOUSE_TLS: "false"
  no_log: true

- name: clickhouse-db secret (engine — step 13)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: clickhouse-db
        namespace: "{{ k8s_namespace }}"
      stringData:
        CLICKHOUSE_HOST: "{{ clickhouse_host }}"
        CLICKHOUSE_PORT: "{{ clickhouse_port }}"
        CLICKHOUSE_USER: "{{ clickhouse_user }}"
        CLICKHOUSE_PASSWORD: "{{ clickhouse_password }}"
        CLICKHOUSE_DATABASE: "{{ clickhouse_database }}"
        CLICKHOUSE_TABLE: "{{ clickhouse_table }}"
  no_log: true
