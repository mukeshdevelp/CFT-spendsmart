---
- name: Fetch ClickHouse password from Secrets Manager
  ansible.builtin.set_fact:
    clickhouse_password: >-
      {{ (lookup('amazon.aws.aws_secret',
                 name_prefix + '/clickhouse',
                 region=aws_region,
                 on_missing='warn') | from_json).password }}
  no_log: true

- name: Fetch PostgreSQL password from Secrets Manager
  ansible.builtin.set_fact:
    postgres_password: >-
      {{ (lookup('amazon.aws.aws_secret',
                 name_prefix + '/postgres',
                 region=aws_region,
                 on_missing='warn') | from_json).password }}
  no_log: true

- name: Ensure application namespace
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ k8s_namespace }}"

- name: Render Harbor dockerconfig
  ansible.builtin.set_fact:
    harbor_dockerconfig_json: "{{ lookup('template', 'dockerconfig.json.j2') }}"
  no_log: true

- name: Harbor image-pull secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: harbor-ldc-coe-regcred
        namespace: "{{ k8s_namespace }}"
      type: kubernetes.io/dockerconfigjson
      stringData:
        .dockerconfigjson: "{{ harbor_dockerconfig_json }}"
  no_log: true

- name: encryption-key secret
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: encryption-key
        namespace: "{{ k8s_namespace }}"
      stringData:
        ENCRYPTION_KEY: "{{ encryption_key }}"
  no_log: true

- name: clickhouse secret (backend)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: clickhouse
        namespace: "{{ k8s_namespace }}"
      stringData:
        CLICKHOUSE_HOST: "{{ clickhouse_host }}"
        CLICKHOUSE_PORT: "{{ clickhouse_port }}"
        CLICKHOUSE_USER: "{{ clickhouse_user }}"
        CLICKHOUSE_PASSWORD: "{{ clickhouse_password }}"
        CLICKHOUSE_DATABASE: "{{ clickhouse_database }}"
  no_log: true

- name: clickhouse-db secret (engine)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: clickhouse-db
        namespace: "{{ k8s_namespace }}"
      stringData:
        CLICKHOUSE_HOST: "{{ clickhouse_host }}"
        CLICKHOUSE_PORT: "{{ clickhouse_port }}"
        CLICKHOUSE_USER: "{{ clickhouse_user }}"
        CLICKHOUSE_PASSWORD: "{{ clickhouse_password }}"
        CLICKHOUSE_DATABASE: "{{ clickhouse_database }}"
        CLICKHOUSE_TABLE: "{{ clickhouse_table }}"
  no_log: true

- name: postgres-config secret (Cloud-Sentry)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: postgres-config
        namespace: "{{ k8s_namespace }}"
      stringData:
        POSTGRES_HOST: "{{ postgres_host }}"
        POSTGRES_PORT: "{{ postgres_port }}"
        POSTGRES_USER: "{{ postgres_user }}"
        POSTGRES_PASSWORD: "{{ postgres_password }}"
        POSTGRES_DB: "{{ postgres_database }}"
  no_log: true

- name: Optional Cloud-Sentry secrets
  when: apply_cloudsentry_secrets | bool
  block:
    - name: gemini-key
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: gemini-key
            namespace: "{{ k8s_namespace }}"
          stringData:
            GEMINI_API_KEY: "{{ gemini_api_key }}"
      when: gemini_api_key | length > 0
      no_log: true

    - name: base-url
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: base-url
            namespace: "{{ k8s_namespace }}"
          stringData:
            BASE_URL: "{{ base_url }}"
      when: base_url | length > 0

    - name: aws-access
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: aws-access
            namespace: "{{ k8s_namespace }}"
          stringData:
            AWS_ACCESS_KEY_ID: "{{ app_aws_access_key_id }}"
            AWS_SECRET_ACCESS_KEY: "{{ app_aws_secret_access_key }}"
      when:
        - app_aws_access_key_id | length > 0
        - app_aws_secret_access_key | length > 0
      no_log: true
