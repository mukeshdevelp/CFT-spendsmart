---
- name: Ensure git is installed
  ansible.builtin.package:
    name: git
    state: present
  become: true

- name: Ensure Helm is installed
  ansible.builtin.command:
    cmd: helm version --short
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: helm_ver
  changed_when: false
  failed_when: false

- name: Install Helm 3
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm
  become: true
  when: helm_ver.rc != 0

- name: Clone SpendSmart chart repository
  ansible.builtin.git:
    repo: "{{ chart_repo }}"
    version: "{{ chart_branch }}"
    dest: "{{ chart_clone_dir }}"
    depth: 1
    force: true

- name: Helm lint
  ansible.builtin.command:
    cmd: helm lint {{ chart_clone_dir }}/{{ chart_subpath }} -f {{ rendered_values_file }}
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Install or upgrade SpendSmart Helm release
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: "{{ helm_release }}"
    chart_ref: "{{ chart_clone_dir }}/{{ chart_subpath }}"
    release_namespace: "{{ k8s_namespace }}"
    create_namespace: true
    values_files:
      - "{{ rendered_values_file }}"
    wait: "{{ helm_wait | bool }}"
    timeout: "{{ helm_timeout }}"
    atomic: "{{ helm_wait | bool }}"

- name: Show workloads in namespace
  ansible.builtin.command:
    cmd: kubectl get deploy,svc,pods,cronjob -n {{ k8s_namespace }}
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
