---
- name: Resolve cluster and VPC from stack outputs
  ansible.builtin.set_fact:
    eks_cluster_name: "{{ cfn_outputs.get('EksClusterName', '') }}"
    vpc_id: "{{ cfn_outputs.get('VpcId', '') }}"

- name: Add EKS Helm repo
  ansible.builtin.command:
    cmd: helm repo add eks https://aws.github.io/eks-charts
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: helm_repo_add
  failed_when: helm_repo_add.rc != 0 and 'already exists' not in helm_repo_add.stderr
  changed_when: helm_repo_add.rc == 0

- name: Update Helm repos
  ansible.builtin.command:
    cmd: helm repo update
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false

- name: Upgrade ALB controller
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig_path }}"
    name: aws-load-balancer-controller
    chart_ref: eks/aws-load-balancer-controller
    release_namespace: kube-system
    create_namespace: true
    chart_version: null
    values:
      clusterName: "{{ eks_cluster_name }}"
      region: "{{ aws_region }}"
      vpcId: "{{ vpc_id }}"
      serviceAccount:
        create: true
        name: aws-load-balancer-controller
    wait: true
    timeout: 15m

- name: Wait for ALB controller rollout
  ansible.builtin.command:
    cmd: kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=15m
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  changed_when: false
