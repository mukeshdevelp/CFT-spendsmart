---
- name: Patch frontend Service NodePort for ALB target group
  ansible.builtin.command:
    cmd: >
      kubectl patch svc {{ helm_release }}-frontend -n {{ k8s_namespace }}
      --type merge
      -p '{"spec":{"type":"NodePort","ports":[{"name":"http","port":80,"targetPort":80,"nodePort":{{ alb_target_port | int }},"protocol":"TCP"}]}}'
  environment:
    KUBECONFIG: "{{ kubeconfig_path }}"
  register: nodeport_patch
  changed_when: "'patched' in nodeport_patch.stdout"
  failed_when: nodeport_patch.rc != 0
