---
- name: Require template bucket
  ansible.builtin.assert:
    that:
      - cfn_template_bucket | length > 0
    fail_msg: CFN_TEMPLATE_BUCKET is required

- name: Check required repository files
  ansible.builtin.stat:
    path: "{{ repo_root }}/{{ item }}"
  loop:
    - main.yml
    - helm-main.yml
    - parameters.json
    - client-a-values.yaml
  register: repo_files

- name: Fail if repository file missing
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Missing {{ item.item }}"
  loop: "{{ repo_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Verify S3 template bucket exists
  amazon.aws.s3_bucket_info:
    name: "{{ cfn_template_bucket }}"
    region: "{{ aws_region }}"
  register: bucket_info

- name: Optional infra stack status
  amazon.aws.cloudformation_info:
    stack_name: "{{ cfn_stack_name }}"
    region: "{{ aws_region }}"
  register: infra_stack_info
  failed_when: false
  when: not (skip_infra_check | default(false) | bool)

- name: Note missing infra stack on first deploy
  ansible.builtin.debug:
    msg: "Infra stack {{ cfn_stack_name }} not found yet (ok for first full deploy)"
  when:
    - not (skip_infra_check | default(false) | bool)
    - infra_stack_info.stacks | default([]) | length == 0
