---
- name: Get infra stack outputs
  amazon.aws.cloudformation_info:
    stack_name: "{{ cfn_stack_name }}"
    region: "{{ aws_region }}"
  register: infra_stack

- name: Map outputs to dict
  ansible.builtin.set_fact:
    infra_outputs: "{{ dict(infra_stack.stacks[0].outputs | map(attribute='output_key') | zip(infra_stack.stacks[0].outputs | map(attribute='output_value'))) }}"

- name: Require critical outputs
  ansible.builtin.assert:
    that:
      - infra_outputs.EksClusterName is defined
      - infra_outputs.EksClusterSecurityGroupId is defined
      - infra_outputs.VpcId is defined
      - infra_outputs.PrivateSubnet1Id is defined
      - infra_outputs.AlbDnsName is defined

- name: Build Helm stack parameters
  ansible.builtin.set_fact:
    helm_cfn_parameters:
      - ParameterKey: NamePrefix
        ParameterValue: "{{ name_prefix }}"
      - ParameterKey: ClusterName
        ParameterValue: "{{ infra_outputs.EksClusterName }}"
      - ParameterKey: ClusterSecurityGroupId
        ParameterValue: "{{ infra_outputs.EksClusterSecurityGroupId }}"
      - ParameterKey: VpcId
        ParameterValue: "{{ infra_outputs.VpcId }}"
      - ParameterKey: PrivateSubnetId
        ParameterValue: "{{ infra_outputs.PrivateSubnet1Id }}"
      - ParameterKey: AlbDnsName
        ParameterValue: "{{ infra_outputs.AlbDnsName }}"
      - ParameterKey: PostgresSecretName
        ParameterValue: "{{ name_prefix }}/postgres"
      - ParameterKey: ClickHouseSecretName
        ParameterValue: "{{ name_prefix }}/clickhouse"
      - ParameterKey: SpendSmartValuesS3Uri
        ParameterValue: "{{ resolved_values_uri }}"
      - ParameterKey: InstallAlbController
        ParameterValue: "{{ install_alb_controller }}"

- name: Write jenkins-helm-parameters.json
  ansible.builtin.copy:
    content: "{{ helm_cfn_parameters | to_nice_json }}\n"
    dest: "{{ repo_root }}/{{ helm_parameters_file }}"
    mode: "0644"
