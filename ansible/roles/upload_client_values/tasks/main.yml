---
- name: Upload client-a-values.yaml to template bucket
  amazon.aws.s3_object:
    bucket: "{{ cfn_template_bucket }}"
    object: client-a-values.yaml
    src: "{{ repo_root }}/client-a-values.yaml"
    mode: put
    encrypt: true
    region: "{{ aws_region }}"
  when: upload_client_values | bool
