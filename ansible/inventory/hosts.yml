---
# Run the playbook on the bastion (kubectl + kubeconfig for private EKS).
# Set ansible_host to the bastion public IP or use SSM/ansible-aws plugin.
all:
  children:
    bastion:
      hosts:
        spendsmart-bastion:
          ansible_host: CHANGE_ME_BASTION_IP
          ansible_user: ec2-user
          kubeconfig_path: /home/ec2-user/.kube/config
