---
# App deploy — Harbor local guide steps 5–6, 12–14, 16–19 (no Minikube ClickHouse install).

aws_region: us-east-1
cfn_stack_name: spendsmart-dev
name_prefix: spendsmart-dev

k8s_namespace: spendsmart
kubeconfig_path: /home/ec2-user/.kube/config

chart_repo: https://github.com/OT-CONTAINER-KIT/helm-charts.git
chart_branch: feature/spendsmart-helm-chart
chart_subpath: charts/spendsmart
chart_clone_dir: /tmp/spendsmart-helm-charts
helm_release: spendsmart
helm_timeout: 25m
helm_wait: true

client_values_file: "{{ playbook_dir }}/../../client-a-values.yaml"
rendered_values_file: /tmp/spendsmart-helm-values.yaml

# EKS ClickHouse (infra bootstrap in `databases` ns) — same secret *keys* as local guide, different host/DB user.
clickhouse_host: clickhouse.databases.svc.cluster.local
clickhouse_port: "8123"
clickhouse_user: default
clickhouse_database: spendsmart
clickhouse_table: service_costs

harbor_docker_server: harbor.ldc.opstree.dev
harbor_docker_username: ""
harbor_docker_password: ""

encryption_key: ""

# Set VITE_API_BASE_URL to http://<AlbDnsName> (ALB listener port 80); frontend NodePort 30080 for TG
inject_cfn_urls: true
alb_listener_port: 80
alb_target_port: 30080
patch_frontend_nodeport: true
keycloak_realm: spendsmart
keycloak_client_id: spendsmart-frontend
keycloak_browser_url: ""
cloudsentry_url: ""

deploy_keycloak: false
configure_keycloak_realm: false
keycloak_admin_user: admin
keycloak_admin_password: ""

apply_cloudsentry_secrets: false

wait_for_cluster: true
min_nodes: 4
min_database_pods_running: 2

install_alb_controller: false
