---
# Repo root (CFT) when playbooks run from ansible/playbooks/
repo_root: "{{ playbook_dir | dirname | dirname }}"

aws_region: "{{ lookup('env', 'AWS_DEFAULT_REGION') | default('us-east-1', true) }}"

cfn_stack_name: "{{ lookup('env', 'CFN_STACK_NAME') | default('spendsmart-dev', true) }}"
helm_stack_name: "{{ lookup('env', 'HELM_STACK_NAME') | default('spendsmart-dev-helm', true) }}"
cfn_template_bucket: "{{ lookup('env', 'CFN_TEMPLATE_BUCKET') }}"
s3_bucket_name: "{{ lookup('env', 'S3_BUCKET_NAME') | default('athena-results-spendsmart-dev', true) }}"
existing_ec2_key_name: "{{ lookup('env', 'EXISTING_EC2_KEY_NAME') | default('mukesh', true) }}"
bastion_ssh_cidrs: "{{ lookup('env', 'BASTION_SSH_CIDRS') | default('0.0.0.0/0', true) }}"
name_prefix: "{{ lookup('env', 'NAME_PREFIX') | default('spendsmart-dev', true) }}"
install_alb_controller: "{{ lookup('env', 'INSTALL_ALB_CONTROLLER') | default('true', true) }}"
k8s_namespace: spendsmart
kubeconfig_bastion_path: /home/ec2-user/.kube/config
min_eks_nodes: 4

packaged_infra: packaged.yml
packaged_helm: packaged-helm.yml
deploy_parameters_file: jenkins-parameters.json
helm_parameters_file: jenkins-helm-parameters.json
infra_change_type_file: .infra-cfn-change-type
helm_change_type_file: .helm-cfn-change-type

upload_client_values: "{{ lookup('env', 'UPLOAD_CLIENT_VALUES') | default('true', true) | bool }}"
spendsmart_values_s3_uri: "{{ lookup('env', 'SPENDSMART_VALUES_S3_URI') | default('', true) }}"
resolved_values_uri: "{{ spendsmart_values_s3_uri if spendsmart_values_s3_uri | length > 0 else ('s3://' + cfn_template_bucket + '/client-a-values.yaml' if upload_client_values else '') }}"

build_number: "{{ lookup('env', 'BUILD_NUMBER') | default('0', true) }}"
runtime_secrets_json_path: "{{ repo_root }}/jenkins-runtime-secrets.json"
