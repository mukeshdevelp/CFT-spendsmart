# Legacy reference — use client-a-values.yaml for Helm deploy.
# Upload to S3 and pass SpendSmartValuesS3Uri, or let the stack generate values from AlbDnsName.

backend:
  image:
    repository: harbor.ldc.opstree.dev/coe/uniteconpro-backend-prod
    tag: latest
  nodeSelector:
    spendsmart.io/workload: backend

frontend:
  image:
    repository: harbor.ldc.opstree.dev/coe/uniteconpro-frontend-prod
    tag: latest
  nodeSelector:
    spendsmart.io/workload: frontend
  service:
    type: NodePort

cloudsentry:
  enabled: false

engine:
  enabled: true
  image:
    repository: harbor.ldc.opstree.dev/coe/uniteconpro-engine-dev
    tag: latest
  schedule: "5 11,23 * * *"
  nodeSelector:
    spendsmart.io/workload: backend
