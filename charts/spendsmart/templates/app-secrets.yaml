{{- if .Values.vm.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: encryption-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spendsmart.labels" . | nindent 4 }}
type: Opaque
stringData:
  GPG_KEY: {{ required "vm.secrets.gpgKey is required when vm.createSecrets=true" .Values.vm.secrets.gpgKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spendsmart.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLICKHOUSE_HOST: {{ .Values.vm.databases.clickhouse.host | quote }}
  CLICKHOUSE_PORT: {{ .Values.vm.databases.clickhouse.port | quote }}
  CLICKHOUSE_USER: {{ .Values.vm.databases.clickhouse.username | quote }}
  CLICKHOUSE_PASSWORD: {{ required "vm.databases.clickhouse.password required" .Values.vm.databases.clickhouse.password | quote }}
  CLICKHOUSE_DATABASE: {{ .Values.vm.databases.clickhouse.database | quote }}
  CLICKHOUSE_TABLE: {{ .Values.vm.databases.clickhouse.table | quote }}
  CLICKHOUSE_TLS: {{ .Values.vm.databases.clickhouse.tls | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spendsmart.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLICKHOUSE_HOST: {{ .Values.vm.databases.clickhouse.host | quote }}
  CLICKHOUSE_PORT: {{ .Values.vm.databases.clickhouse.port | quote }}
  CLICKHOUSE_USER: {{ .Values.vm.databases.clickhouse.username | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.vm.databases.clickhouse.password | quote }}
  CLICKHOUSE_DATABASE: {{ .Values.vm.databases.clickhouse.database | quote }}
  CLICKHOUSE_TABLE: {{ .Values.vm.databases.clickhouse.table | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spendsmart.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.vm.secrets.keycloak.adminUsername | quote }}
  password: {{ required "vm.secrets.keycloak.adminPassword required" .Values.vm.secrets.keycloak.adminPassword | quote }}
{{- if .Values.cloudsentry.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gemini-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spendsmart.labels" . | nindent 4 }}
type: Opaque
stringData:
  GEMINI_API_KEY: {{ required "vm.secrets.geminiApiKey when cloudsentry.enabled" .Values.vm.secrets.geminiApiKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spendsmart.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_HOST: {{ .Values.vm.databases.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.vm.databases.postgres.port | quote }}
  POSTGRES_USER: {{ .Values.vm.databases.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.vm.databases.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.vm.databases.postgres.database | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%s/%s" .Values.vm.databases.postgres.username .Values.vm.databases.postgres.password .Values.vm.databases.postgres.host .Values.vm.databases.postgres.port .Values.vm.databases.postgres.database | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-access
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spendsmart.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.vm.secrets.cloudsentry.awsAccessKeyId | default "" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.vm.secrets.cloudsentry.awsSecretAccessKey | default "" | quote }}
  AWS_DEFAULT_REGION: {{ .Values.vm.secrets.cloudsentry.awsDefaultRegion | default "gcp" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: base-url
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spendsmart.labels" . | nindent 4 }}
type: Opaque
stringData:
  BASE_URL: {{ required "vm.secrets.cloudsentry.publicBaseUrl when cloudsentry.enabled" .Values.vm.secrets.cloudsentry.publicBaseUrl | quote }}
  PUBLIC_BASE_URL: {{ .Values.vm.secrets.cloudsentry.publicBaseUrl | quote }}
{{- end }}
{{- end }}