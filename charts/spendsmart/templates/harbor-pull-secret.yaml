{{- if and .Values.vm.harbor.createPullSecret .Values.vm.harbor.username .Values.vm.harbor.password }}
{{- $server := .Values.vm.harbor.server | default .Values.harbor.server -}}
{{- $auth := printf "%s:%s" .Values.vm.harbor.username .Values.vm.harbor.password | b64enc -}}
apiVersion: v1
kind: Secret
metadata:
  name: harbor-regcred
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spendsmart.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" $server .Values.vm.harbor.username .Values.vm.harbor.password $auth | b64enc }}
{{- end }}